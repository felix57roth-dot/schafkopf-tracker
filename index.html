/* v1.2: Mobile Ansicht – lange Rundennamen dürfen nicht die Seitenbreite verändern. */
html,body{max-width:100%;overflow-x:clip}
.app,.main,.hero,.dashboardgrid,.section,.card,.list{min-width:0}
.app{width:100%}
.list{grid-template-columns:minmax(0,1fr)}
.entryinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amount{white-space:nowrap}
.balancebar>div{min-width:0}
.balance strong{overflow-wrap:anywhere}
.kpi b{overflow-wrap:anywhere}
@media(max-width:650px){
 .entry{display:grid;grid-template-columns:56px minmax(0,1fr) 34px;grid-template-rows:auto auto;grid-template-areas:"date info remove" "date amount remove";column-gap:12px;row-gap:3px;padding:12px;align-items:center;width:100%}
 .entry .datebadge{grid-area:date;min-width:0;width:56px;align-self:center}
 .entry .entryinfo{grid-area:info;min-width:0;max-width:100%;width:100%}
 .entry .amount{grid-area:amount;justify-self:start;font-size:14px}
 .entry .mini-btn{grid-area:remove;min-width:34px;height:36px;justify-self:end}
}
@media(max-width:480px){
 .brand{font-size:clamp(13px,3.8vw,17px);gap:7px;white-space:nowrap}
 .emblem{width:38px;height:38px;flex:0 0 38px}
 .suite{gap:0;flex-shrink:0}
 .suite .suit{width:clamp(16px,5vw,25px);height:26px}
 .balance strong{font-size:clamp(26px,8.4vw,37px)}
 .kpi b{font-size:clamp(16px,4.7vw,20px)}
}
@media(max-width:350px){.balancebar{flex-wrap:wrap}.balancebar .btn{width:100%}}
/* Informationsbanner liegt oberhalb der unteren Navigation. */
.update-banner{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(580px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #bcd6c8;border-radius:17px;background:#fff;box-shadow:0 14px 45px rgba(11,46,33,.2)}

@media(max-width:440px){.update-banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.update-banner .update-text{grid-column:1/-1}.update-banner .btn{justify-self:start}}

/* v1.3: Skalierung der Gewinnentwicklung mit Euro-Achse. */
.chart-wrap{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;align-items:stretch;min-width:0}
.chart-y-axis{position:relative;min-width:0;height:210px}
.chart-y-axis .tick{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:650;color:#52675a;font-variant-numeric:tabular-nums}
.chart-y-axis .tick.zero{color:#254b3d;font-weight:800}
.chart-plot{min-width:0;width:100%;height:210px}
.chart-x-labels{display:flex;justify-content:space-between;gap:10px;margin-left:68px;margin-top:7px}
.chart-x-labels span:last-child{text-align:right}
@media(max-width:390px){.chartcard{padding:14px 11px}.chart-wrap{grid-template-columns:55px minmax(0,1fr);gap:4px}.chart-y-axis .tick{font-size:11px}.chart-x-labels{margin-left:59px}}
/* Unterseiten: Titel stehen jetzt kontrastreich im grünen Kopfbereich. */

@media(max-width:650px){
 .entry{grid-template-columns:56px minmax(0,1fr) 74px;grid-template-areas:"date info actions" "date amount actions"}
 .entry .entry-actions{grid-area:actions;justify-self:end;align-self:center}

.chart-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.filters{display:grid;gap:12px;box-shadow:none}
.year-picker{font-size:13px;font-weight:700;color:#456052;white-space:nowrap}

.year-kpis{margin-top:8px}
.stat-card{padding:17px;min-width:0}
.stat-card b{display:block;font-size:22px;margin-top:8px;overflow-wrap:anywhere}
.stat-card .help{margin-top:6px;overflow-wrap:anywhere}
.months{display:grid;gap:11px;margin:18px 0 17px}
.month-line{display:grid;grid-template-columns:31px minmax(0,1fr) 95px;gap:7px;align-items:center}

.month-track{position:relative;height:17px;background:#f4f7f4;border-radius:4px;overflow:hidden}

.year-rows{display:grid;gap:0;margin-top:13px}

.year-line span{flex:1;color:#74817a;font-size:12px}
.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}

.goal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.goal-target{font-size:12px;font-weight:750;color:#315447}
.progress{margin:12px 0 8px;height:11px;border-radius:99px;background:#e6eee6;overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#0d7454,#6aae70);transition:width .2s}
.goal-form{display:grid;gap:12px}

.import-label{display:inline-block;cursor:pointer}
.import-preview{padding:14px;border:1px solid #b7d3c3;border-radius:14px;background:#f4f8f3;display:grid;gap:12px}
.btn.danger{background:#a9433e;color:white}
@media(max-width:420px){
 .record-grid{grid-template-columns:minmax(0,1fr)}
 .record-grid .stat-card:last-child:nth-child(odd){grid-column:auto}

 .year-kpis .stat-card:first-child{grid-column:1/-1}
 .stat-card b{font-size:20px}

}


/* v1.5: Nur die Dashboard-Bilanz liegt auf dem grünen Kopfbereich. */
.app.is-subpage .hero{padding-bottom:30px}
.app.is-subpage .main{margin-top:0}
.app.is-subpage .content-page{padding-top:20px}
/* Die Jahresauswahl muss sich auf schmalen Smartphones umbrechen koennen. */
.stats-heading{flex-wrap:wrap;align-items:center;gap:12px}
.stats-heading h2{flex:1 1 210px;min-width:0;line-height:1.2;overflow-wrap:normal}
.stats-heading .year-picker{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
@media(max-width:360px){.stats-heading h2{flex-basis:100%}.stats-heading .year-picker{margin-left:0}}

/* v1.6: Einzelspiele mit Spielarten, Icon-Karten und Spielarten-Statistiken */
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-option input{position:absolute;opacity:0;pointer-events:none}
.mode-option{position:relative}
.mode-card{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid #d7e3d8;background:#f6f8f5;color:#315447;border-radius:14px;font-weight:800;cursor:pointer;text-align:center}
.mode-option input:checked + .mode-card{background:#0d7454;color:#fff;border-color:#0d7454}
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game-option input{position:absolute;opacity:0;pointer-events:none}
.game-option{position:relative}
.game-card{border:1px solid #d7e3d8;border-radius:16px;background:linear-gradient(180deg,#fafbfa,#f1f4f0);padding:11px 8px;display:grid;gap:8px;min-height:110px;align-items:center;justify-items:center;text-align:center;box-shadow:0 4px 12px rgba(11,46,33,.04);cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow}
.game-card .gico{width:50px;height:38px;color:#203a31;display:grid;place-items:center}
.game-card .gico svg{width:100%;height:100%}
.game-card .glabel{font-size:12px;font-weight:800;line-height:1.15}
.game-option input:checked + .game-card{border-color:#c39a43;box-shadow:0 8px 20px rgba(195,154,67,.20);background:linear-gradient(180deg,#fffdf7,#f8f0dd);transform:translateY(-1px)}
.game-option input:focus-visible + .game-card{outline:3px solid #c39a43;outline-offset:2px}
.form-hint{font-size:12px;color:var(--muted);margin-top:-4px}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.small-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;background:#edf5ee;color:#315447;font-size:11px;font-weight:800;line-height:1}

.small-badge .mini-ico svg{width:100%;height:100%}
.small-badge.session{background:#f3f4ef;color:#55675d}
.game-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.game-type-list{display:grid;gap:10px}
.game-type-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,.8fr));gap:10px;align-items:center;padding:13px 14px}

.game-type-cell{min-width:0;font-size:13px}
.game-type-main{display:flex;align-items:center;gap:10px;min-width:0}
.game-type-main .gico{width:38px;height:30px;flex:0 0 38px}
.game-type-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-type-main small{display:block;color:var(--muted);font-size:11px}
.game-type-row .amount{justify-self:end}
.inline-note{font-size:11px;color:var(--muted)}
@media(max-width:760px){.game-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-type-row{grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));grid-template-areas:"main count total" "main wl avg";row-gap:6px}.game-type-row .main{grid-area:main}.game-type-row .count{grid-area:count}.game-type-row .total{grid-area:total}.game-type-row .wl{grid-area:wl}.game-type-row .avg{grid-area:avg}.game-type-row .rate{display:none}.game-type-head{display:none}}
@media(max-width:440px){.game-grid{grid-template-columns:1fr 1fr}.game-card{min-height:102px;padding:10px 6px}.game-card .glabel{font-size:11px}.mode-card{padding:11px 10px;font-size:13px}.game-type-row{padding:12px 11px}.game-type-main .gico{width:34px;height:28px}}
/* v1.7 – schnell bedienbare, klar getrennte Ansicht */
.hero{padding-bottom:65px}
.app.is-subpage .hero{padding-bottom:26px}
.game-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:18px;box-shadow:var(--shadow)}

.game-fast-panel{padding:18px 15px}
.game-fast-panel .sectionhead{margin-bottom:16px}
.fast-game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.game-select{min-width:0;border:1.5px solid #d9e3d9;border-radius:12px;background:linear-gradient(180deg,#fbfcfa,#eff4ed);color:#213d32;padding:9px 3px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-height:78px;font-size:11px;line-height:1.2;font-weight:800;text-align:center}

 const card=(x,y,angle,suit,color,mark='A')=>`<g transform="translate(${x} ${y}) rotate(${angle} 16 23)"><rect x="0" y="0" width="32" height="45" rx="4" fill="#fffefa" stroke="#bfc6c1" stroke-width="1.3"/><text x="4" y="10" font-size="9" font-weight="900" fill="${color}">${mark}</text><text x="16" y="32" text-anchor="middle" font-size="19" fill="${color}">${suit}</text></g>`;
 const suits={heart:'♥',leaf:'♠',acorn:'♣',bell:'♦'};
 let drawing='';
 switch(id){

  case 'ramsch':drawing='<text x="46" y="43" text-anchor="middle" font-size="39">👥</text><path d="M25 22L66 47 M66 22L25 47" stroke="#dc2c44" stroke-width="7" stroke-linecap="round"/>';break;
  case 'hochzeit': drawing='<text x="45" y="46" text-anchor="middle" font-size="42">💍</text>';break;
  case 'hirsch': drawing='<text x="46" y="45" text-anchor="middle" font-size="43">🦌</text>';break;
  case 'bockrunde':drawing='<text x="46" y="45" text-anchor="middle" font-size="42">🐐</text>';break;

const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.floor(Number(v)||0)));
function baseFor(type){
 if(['rufspiel','ramsch','bockrunde','hirsch'].includes(type))return .1;
 if(['hochzeit','kreuzrunde'].includes(type))return .2;
 if(['solo','wenz','geier','farbwenz','farbgeier','bettel','tout'].includes(type))return .5;
 if(type==='sie')return 2; // 4 × Solo (0,50 €)
 return null;
}
function calcPricing(input){
 const type=input.type,base=baseFor(type);
 if(base===null)return {manual:true,price:0,amount:0,lines:[]};
 const knocks=clampInt(input.knocks,0,8);
 const bid=clampInt(input.bid,0,3);
 const runnersRaw=clampInt(input.runners,0,8);
 const runners=runnersRaw>=3?runnersRaw:0;
 const jungfrau=type==='ramsch'?clampInt(input.jungfrau,0,3):0;
 const points=clampInt(input.points,0,120);
 const role=input.role==='defender'?'defender':type==='ramsch'&&input.role==='payer'?'payer':type==='ramsch'?'receiver':'declarer';
 const bock=type==='bockrunde'||!!input.bock;
 const cashSolo=SOLO_TYPES.includes(type);
 const pointGame=!['bettel','ramsch','tout','sie'].includes(type);
 let won=false,schneider=false,schwarz=false,loserPoints=null,usedRunners=0;
 if(pointGame){
  // Als Gegner reichen 60 Augen. Die Ansager-Partei muss mindestens 61 haben.
  won=role==='defender'?points>=60:points>=61;
  loserPoints=won?120-points:points;
  schneider=loserPoints<30;
  schwarz=loserPoints===0; // auch wenn ein punktloser Stich gemacht wurde
  usedRunners=runners;
 }else if(type==='bettel'){
  const tricks=clampInt(input.tricks,0,8);
  const declarerWon=tricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
 }else if(type==='ramsch'){
  won=role!=='payer';
 }else if(type==='tout'){
  // Tout gelingt nur bei 8 Ansagerstichen: kein Stich für die Gegenpartei.
  const opponentTricks=clampInt(input.tricks,0,8);
  const declarerWon=opponentTricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
  usedRunners=runners;
 }else if(type==='sie'){
  won=true; // Das angesagte Sie gewinnt definitionsgemäß.
  usedRunners=8;
 }
 // Geldbeträge konsequent in Cent berechnen.
 const baseCents=Math.round(base*100);
 const schneiderCents=schneider?10:0;
 const schwarzCents=schwarz?10:0;
 const runnerCents=usedRunners*10;
 const subtotalCents=baseCents+schneiderCents+schwarzCents+runnerCents;
 const specialMultiplier=type==='tout'||type==='sie'?2:1;
 const knockMultiplier=2**knocks;
 const jungfrauMultiplier=2**jungfrau;
 const bidMultiplier=2**(type==='hirsch'?3:bid);
 const bockMultiplier=bock?2:1;
 const multiplier=specialMultiplier*knockMultiplier*jungfrauMultiplier*bidMultiplier*bockMultiplier;
 const priceCents=subtotalCents*multiplier;
 const roleFactor=type==='ramsch'?(won?1:3):cashSolo?(role==='defender'?1:3):1;
 const amountCents=(won?1:-1)*priceCents*roleFactor;
 return {manual:false,won,schneider,schwarz,loserPoints,runner:usedRunners,runners:usedRunners,jungfrau,knocks,role,roleFactor,base,extras:schneiderCents/100,blackExtra:schwarzCents/100,runnerExtra:runnerCents/100,subtotal:subtotalCents/100,price:priceCents/100,amount:amountCents/100,multiplier,specialMultiplier,knockMultiplier,jungfrauMultiplier,bidMultiplier,bid:type==='hirsch'?3:bid,bock,bockMultiplier,points};
