</style></head><body><div id="app" class="app"><header class="hero"><div class="top"><div class="brand"><div class="emblem" id="brandSuit"></div><span>Schafkopf <span style="color:#e4c47b">Tracker</span></span></div><div class="suite" id="suits"></div></div><h1 id="headerTitle">Servus am Kartentisch!</h1><p id="headerSub">Alle deine Schafkopfabende auf einen Blick.</p></header><main class="main" id="main"></main><nav class="nav" id="nav"></nav><div id="updateBanner" class="update-banner hidden" role="status" aria-live="polite"><div class="update-text"><b>🃏 Neue Version verfügbar!</b><p>Ein Update ist bereit. Deine gespeicherten Spielabende bleiben erhalten.</p></div><button type="button" class="btn" id="applyUpdate">Aktualisieren</button><button type="button" class="mini-btn" id="dismissUpdate" aria-label="Später aktualisieren" title="Später">✕</button></div></div><script>

const glyph={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21v-8h6v8"/>',history:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',friends:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 16a5 5 0 0 1 4 5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',plus:'<path d="M12 5v14M5 12h14"/>'};glyph.stats='<path d="M4 20V13M10 20V9M16 20V4M22 20H2"/>';const symbol=(x)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyph[x]}</svg>`;

const VERSION='1.4';
/* Der vorhandene LocalStorage-Schlüssel wird absichtlich NICHT verändert. */
const KEY='schafkopf-tracker-v1';

let state=defaultState();
try{
  const saved=JSON.parse(localStorage.getItem(KEY));
  if(saved&&typeof saved==='object'&&!Array.isArray(saved))state={...defaultState(),...saved};
}catch(err){console.warn('Lokale Daten konnten nicht gelesen werden.',err);}
if(!Array.isArray(state.entries))state.entries=[];
let tab='home',editingId=null,chartRange='all',chartSelected=null;
let filters={q:'',from:'',to:'',type:'all',sort:'new'};
let importCandidate=null;
const fmtEUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});

const parseAmount=s=>{let v=String(s||'').trim().replace(',','.');return /^\d+(?:\.\d{1,2})?$/.test(v)?Math.round(Number(v)*100)/100:NaN;};
const monthLabel=m=>new Date(2024,m,1).toLocaleDateString('de-DE',{month:'short'});
const entryTitle=e=>e.place||'Schafkopfabend';

function years(){return [...new Set([...state.entries.map(e=>Number(e.date.slice(0,4))),thisYear()].filter(Number.isFinite))].sort((a,b)=>b-a);}

function sessionRecords(){
 const entries=sorted(),won=entries.filter(e=>e.amount>0),lost=entries.filter(e=>e.amount<0);
 let bestRun=0,bestLossRun=0,runWin=0,runLoss=0;
 for(const e of entries){runWin=e.amount>0?runWin+1:0;runLoss=e.amount<0?runLoss+1:0;bestRun=Math.max(bestRun,runWin);bestLossRun=Math.max(bestLossRun,runLoss);}
 let currentType=entries.length?(entries.at(-1).amount>0?'win':entries.at(-1).amount<0?'loss':'tie'):'tie',current=0;
 if(currentType!=='tie')for(let i=entries.length-1;i>=0;i--){if((currentType==='win'&&entries[i].amount>0)||(currentType==='loss'&&entries[i].amount<0))current++;else break;}
 return {best:won.length?won.reduce((a,b)=>a.amount>=b.amount?a:b):null,worst:lost.length?lost.reduce((a,b)=>a.amount<=b.amount?a:b):null,bestRun,bestLossRun,current,currentType};
}
/* Chart: Kumulierte Gesamtbilanz mit optionalem Ausschnitt, Achse und Punktdetails. */
function chartData(){
 const all=sorted(),current=nowISO().slice(0,7),withTotals=[];let sum=0;
 all.forEach(e=>{sum=Math.round((sum+e.amount)*100)/100;withTotals.push({...e,cumulative:sum});});
 let points=chartRange==='last10'?withTotals.slice(-10):chartRange==='month'?withTotals.filter(e=>e.date.slice(0,7)===current):withTotals;
 const start=points.length?Math.round((points[0].cumulative-points[0].amount)*100)/100:0;
 return {points,start,allCount:all.length};
}
function niceAxis(minVal,maxVal){
 const lo=minVal===maxVal?minVal-5:minVal,hi=minVal===maxVal?maxVal+5:maxVal;
 const rough=(hi-lo)/4,magnitude=Math.pow(10,Math.floor(Math.log10(rough||1)));
 const step=Math.max(.01,([1,2,2.5,5,10].find(x=>x*magnitude>=rough)||10)*magnitude);
 let low=Math.floor(lo/step)*step,high=Math.ceil(hi/step)*step;
 if(low===high){low-=step;high+=step;}
 const ticks=[];for(let v=low,i=0;v<=high+step*.001&&i<16;i++,v=low+i*step)ticks.push(Math.abs(v)<1e-8?0:+v.toFixed(4));
 return {low,high,ticks};
}
function chart(){
 const {points,start}=chartData();
 const vals=[start,...points.map(p=>p.cumulative)];
 const axis=niceAxis(Math.min(0,...vals),Math.max(0,...vals));
 const W=720,H=210,left=11,right=12,top=16,bottom=19,span=axis.high-axis.low;
 const x=i=>left+(W-left-right)*(vals.length<2?0:i/(vals.length-1));
 const y=v=>top+(H-top-bottom)*(1-(v-axis.low)/span);
 const path=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ');
 const grid=axis.ticks.map(v=>`<path d="M${left} ${y(v).toFixed(2)}H${W-right}" class="gridline"/>`).join('');
 const tickMoney=v=>(v>0?'+':'')+new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(v)+' €';
 const labels=axis.ticks.map(v=>`<span class="tick ${v===0?'zero':''}" style="top:${(y(v)/H*100).toFixed(3)}%">${tickMoney(v)}</span>`).join('');
 const chosen=chartSelected===null?points.length:Math.max(0,Math.min(points.length,chartSelected));
 const currentPoint=points[chosen-1];
 const selectedInfo=chosen===0?{date:'Startwert des Zeitraums',amount:null,cumulative:start}:currentPoint;
 const dots=points.map((p,i)=>{
   const pos=i+1;
   return `<circle class="chart-dot ${chosen===pos?'selected':''}" cx="${x(pos)}" cy="${y(p.cumulative)}" r="${chosen===pos?6:3.5}" fill="#0d7454" stroke="white" stroke-width="2"/><circle class="chart-hit" data-point="${pos}" tabindex="0" role="button" aria-label="Spielabend ${i+1} auswählen" cx="${x(pos)}" cy="${y(p.cumulative)}" r="${Math.max(7,Math.min(13,330/Math.max(1,points.length)))}" fill="transparent"/>`;
 }).join('');
 const line=vals.length>1?path:`M${left} ${y(start)} H${W-right}`;
 return `<div class="chart-toolbar" role="group" aria-label="Zeitraum der Gewinnentwicklung">
  ${[['all','Gesamt'],['last10','Letzte 10'],['month','Dieser Monat']].map(([id,name])=>`<button class="chip ${chartRange===id?'chosen':''}" data-chart-range="${id}" aria-pressed="${chartRange===id}">${name}</button>`).join('')}
 </div><div class="chart-wrap"><div class="chart-y-axis" aria-hidden="true">${labels}</div><svg class="chart chart-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Kumulierte Gewinnentwicklung mit auswählbaren Punkten">${grid}<path d="M${left} ${y(0).toFixed(2)}H${W-right}" stroke="#8aa698" stroke-width="1.6" stroke-dasharray="6 5"/><path class="chartline" d="${line}"/>${dots}<circle cx="${x(chosen)}" cy="${y(vals[chosen])}" r="6" fill="#0d7454" stroke="white" stroke-width="2" pointer-events="none"/></svg></div>
 <div class="subtle chart-x-labels"><span>${points.length?new Date(points[0].date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'Start'}</span><span>${points.length?new Date(points.at(-1).date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'Keine Einträge'}</span></div>
 <div class="chart-inspector" aria-live="polite"><div class="chart-inspector-top"><b>${selectedInfo.amount===null?'Zeitraumbeginn':new Date(selectedInfo.date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}</b><span class="amount ${amountColor(selectedInfo.cumulative)}">${euro(selectedInfo.cumulative)} Gesamtstand</span></div><div class="help">${selectedInfo.amount===null?'Ausgangsbilanz vor den angezeigten Abenden':`Abend: ${euro(selectedInfo.amount)}${selectedInfo.place?' · '+esc(selectedInfo.place):''}`}</div></div>
 ${points.length?`<label class="scrub-label" for="chartScrub">Spielabend im Diagramm auswählen</label><input id="chartScrub" type="range" min="0" max="${points.length}" value="${chosen}" aria-label="Spielabend im Diagramm auswählen">`: '<div class="help">Trage einen Abend ein, um deine Entwicklung zu sehen.</div>'}`;
}

}
function showImportPreview(){
 const target=document.getElementById('importPreview');if(!target||!importCandidate)return;
 const {filename,data}=importCandidate;
 const fingerprints=new Set(state.entries.map(entryFingerprint));
 const duplicates=data.entries.filter(e=>fingerprints.has(entryFingerprint(e))).length;
 target.innerHTML=`<div class="import-preview"><b>Backup-Vorschau</b><div class="help">Datei: ${esc(filename)}<br>${data.entries.length} Abende · Bilanz ${euro(total(data.entries))}<br>Davon ${duplicates} bereits in deinen aktuellen Daten vorhanden (gleicher Inhalt).</div><div class="exportline"><button type="button" class="btn secondary" id="mergeImport">Nur neue Abende ergänzen</button><button type="button" class="btn danger" id="replaceImport">Alle Daten ersetzen</button><button type="button" class="btn ghost" id="cancelImport">Abbrechen</button></div><p class="help">Ergänzen übernimmt nur fehlende Spielabende und behält deinen aktuellen Namen und dein Ziel. Ersetzen überschreibt auch Profil und Ziel.</p></div>`;
}
function applyImport(mode){if(!importCandidate)return;
 const incoming=importCandidate.data;
 if(mode==='replace'){
  if(!confirm('ACHTUNG: Deine aktuellen Spielabende, dein Name und dein Ziel werden ersetzt. Hast du vorher ein Backup exportiert?'))return;
  state={...defaultState(),...incoming};
 }else{
  const fps=new Set(state.entries.map(entryFingerprint));
  const ids=new Set(state.entries.map(e=>String(e.id)));
  for(const e of incoming.entries){const fp=entryFingerprint(e);if(fps.has(fp))continue;const item={...e,id:ids.has(e.id)?uniqueID():e.id};ids.add(item.id);fps.add(fp);state.entries.push(item);}
 }
 if(!persist())return;
 importCandidate=null;editingId=null;render();alert('Import erfolgreich. '+state.entries.length+' Abende sind jetzt gespeichert.');
}
function exportBackup(){
 const exported=new Date().toISOString(),payload={version:2,appVersion:VERSION,exported,profile:{...state}};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`schafkopf-backup-${nowISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
 state.lastBackupAt=exported;state.lastBackupCount=state.entries.length;persist();render();
}
/* Delegierte Handler bleiben auch nach einem Re-Render gültig. */
document.addEventListener('click',async e=>{
 const target=e.target;
 if(target.closest('#applyUpdate')){
  if(pendingUpdate){const button=document.getElementById('applyUpdate');button.disabled=true;button.textContent='Wird aktualisiert…';pendingUpdate.postMessage({type:'SKIP_WAITING'});}return;
 }
 if(target.closest('#dismissUpdate')){document.getElementById('updateBanner').classList.add('hidden');return;}
 if(target.closest('#checkUpdate')){
  const out=document.getElementById('updateStatus');
  if(!('serviceWorker' in navigator)){out.textContent='Updates werden von diesem Browser nicht unterstützt.';return;}
  if(!navigator.onLine){out.textContent='Du bist offline. Bitte später erneut prüfen.';return;}
  out.textContent='Suche nach Updates…';
  try{const reg=await navigator.serviceWorker.ready;await reg.update();out.textContent=reg.waiting?'Update verfügbar – unten „Aktualisieren“ wählen.':'Prüfung abgeschlossen. Wenn ein Update bereitsteht, erscheint eine Meldung.';if(reg.waiting)offerUpdate(reg.waiting);}catch{out.textContent='Update-Prüfung fehlgeschlagen.';}
  return;
 }
 const chartButton=target.closest('[data-chart-range]');if(chartButton){chartRange=chartButton.dataset.chartRange;chartSelected=null;renderChart();return;}
 const point=target.closest('[data-point]');if(point){chartSelected=Number(point.dataset.point);renderChart();return;}
 const nav=target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;editingId=null;chartSelected=null;render();window.scrollTo(0,0);return;}
 if(target.closest('#newEntry')){tab='history';editingId=null;render();window.scrollTo(0,0);document.getElementById('amount').focus();return;}
 const edit=target.closest('[data-edit]');if(edit){beginEdit(edit.dataset.edit);return;}
 const del=target.closest('[data-delete]');if(del){if(confirm('Diesen Schafkopfabend wirklich löschen?')){state.entries=state.entries.filter(x=>String(x.id)!==del.dataset.delete);if(String(editingId)===del.dataset.delete)editingId=null;persist();render();}return;}
 if(target.closest('#cancelEdit')){editingId=null;render();return;}
 if(target.closest('#clearFilters')){filters={q:'',from:'',to:'',type:'all',sort:'new'};render();return;}
 if(target.closest('#saveName')){state.name=document.getElementById('profileName').value.trim();persist();render();return;}
 if(target.closest('#visibility')){state.public=!state.public;persist();render();return;}
 if(target.closest('#clearGoal')){state.goalTarget=0;persist();render();return;}
 if(target.closest('#export')){exportBackup();return;}
 if(target.closest('#cancelImport')){importCandidate=null;const l=document.getElementById('importPreview');if(l)l.innerHTML='';return;}
 if(target.closest('#mergeImport')){applyImport('merge');return;}
 if(target.closest('#replaceImport')){applyImport('replace');return;}
});
document.addEventListener('keydown',e=>{
 const point=e.target.closest('[data-point]');if(point&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chartSelected=Number(point.dataset.point);renderChart();}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='entryForm'){
  e.preventDefault();const out=document.getElementById('entryError');out.textContent='';
  try{
   const values=readEditor();
   if(editingId){const current=state.entries.find(x=>String(x.id)===String(editingId));if(!current)throw new Error('Der ausgewählte Abend wurde nicht gefunden.');Object.assign(current,values);}else state.entries.push({id:uniqueID(),...values});
   if(!persist())return;editingId=null;render();
  }catch(err){out.textContent=err.message||'Die Eingabe konnte nicht gespeichert werden.';}
  return;
 }
 if(e.target.id==='goalForm'){
  e.preventDefault();const value=document.getElementById('goalAmount').value,goal=parseAmount(value);
  if(!Number.isFinite(goal)||goal<=0){alert('Bitte ein positives Ziel eingeben, z. B. 50,00.');return;}
  state.goalTarget=goal;if(persist())render();return;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='filterQuery'){filters.q=e.target.value;updateHistoryList();return;}
});
document.addEventListener('change',async e=>{
 const id=e.target.id;
 if(id==='chartScrub'){chartSelected=Number(e.target.value);renderChart();return;}
 if(id==='filterFrom'){filters.from=e.target.value;updateHistoryList();return;}
 if(id==='filterTo'){filters.to=e.target.value;updateHistoryList();return;}
 if(id==='filterType'){filters.type=e.target.value;updateHistoryList();return;}
 if(id==='filterSort'){filters.sort=e.target.value;updateHistoryList();return;}
 if(id==='statYear'){selectedYear=Number(e.target.value);render();return;}
 if(id==='import'){
  const file=e.target.files[0];if(!file)return;
  if(file.size>10*1024*1024){alert('Backup ist zu groß (max. 10 MB).');e.target.value='';return;}
  try{const json=JSON.parse(await file.text()),data=normalizeBackup(json);importCandidate={filename:file.name,data};showImportPreview();}
  catch(err){importCandidate=null;document.getElementById('importPreview').innerHTML='';alert('Die Sicherung konnte nicht geladen werden: '+(err.message||'ungültig'));}
  e.target.value='';return;
 }
});
/* Service Worker kontrolliert Versionswechsel; LocalStorage bleibt unangetastet. */
let pendingUpdate=null;
function offerUpdate(worker){pendingUpdate=worker;document.getElementById('updateBanner').classList.remove('hidden');}
if('serviceWorker' in navigator){
 let hadController=!!navigator.serviceWorker.controller,reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(hadController&&!reloaded){reloaded=true;location.reload();}
  hadController=true;
 });
 window.addEventListener('load',async()=>{
  try{
   const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
   const watch=worker=>{if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(worker);});};
   if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);
   watch(reg.installing);
   reg.addEventListener('updatefound',()=>watch(reg.installing));
   if(navigator.onLine)reg.update().catch(()=>{});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine)reg.update().catch(()=>{});});
  }catch(err){console.warn('Service Worker nicht verfügbar',err);}
 });
}
render();

</script></body></html>
