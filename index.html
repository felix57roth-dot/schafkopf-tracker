<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f27"><meta name="description" content="Schafkopf Tracker – Deine Spielabende, deine Bilanz."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><title>Schafkopf Tracker</title><style>
:root{--bg:#f6f5ef;--surface:#fff;--ink:#15332c;--muted:#74817a;--green:#0d7454;--red:#bd5147;--gold:#c39a43;--line:#e7eae3;--shadow:0 12px 35px rgba(11,46,33,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer} .app{max-width:1050px;margin:auto;min-height:100vh;padding-bottom:100px}.hero{background:#12392e;color:#fff;padding:24px 26px 80px;border-radius:0 0 32px 32px;background-image:radial-gradient(circle at 82% 12%,#315c47 0,transparent 34%),linear-gradient(145deg,#12392e,#102a23)}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:-.5px}.emblem{background:#f3ead6;border-radius:13px;width:44px;height:44px;display:grid;place-items:center}.emblem svg{width:31px}.eyebrow{font-size:11px;text-transform:uppercase;font-weight:750;letter-spacing:2px;opacity:.63}h1{font-size:clamp(28px,5vw,42px);margin:26px 0 6px;letter-spacing:-1.5px}.hero p{margin:0;color:#bad1c7}.suite{display:flex;gap:8px}.suit{display:inline-flex;width:27px;height:31px;align-items:center;justify-content:center}.suit svg{width:100%;height:100%}.main{margin:-52px auto 0;padding:0 22px;position:relative}.card{border:1px solid var(--line);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}.balance{padding:23px 24px}.small{font-size:13px;color:var(--muted)}.balance strong{display:block;font-size:43px;margin:9px 0 4px;letter-spacing:-1.7px}.positive{color:var(--green)}.negative{color:var(--red)}.btn{border:none;border-radius:14px;padding:14px 18px;background:var(--green);color:white;font-weight:750}.btn.secondary{background:#e9f2ec;color:var(--green)}.btn.ghost{background:#f5f5f1;color:#315447}.balancebar{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{margin-top:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section h2{font-size:19px;letter-spacing:-.5px;margin:0}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kpi{padding:18px}.kpi b{font-size:25px;display:block;margin-top:8px}.chartcard{padding:18px}.chart{width:100%;height:210px;display:block}.chartline{stroke:var(--green);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.gridline{stroke:#edf1eb;stroke-width:1}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1050px);background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;padding:9px 8px max(12px,env(safe-area-inset-bottom))}.nav button{background:none;border:none;flex:1;color:#819089;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:11px;font-weight:700;padding:6px 2px}.nav button.active{color:var(--green)}.nav svg{width:23px;height:23px}.list{display:grid;gap:10px}.entry{display:flex;align-items:center;gap:12px;padding:14px 17px}.datebadge{background:#f0f4ee;color:#35634a;border-radius:12px;min-width:56px;padding:9px 5px;text-align:center;font-weight:850}.datebadge small{display:block;font-size:10px;font-weight:750;text-transform:uppercase}.entry .entryinfo{flex:1;min-width:0}.entryinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entryinfo span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.amount{font-weight:850;font-variant-numeric:tabular-nums}.mini-btn{border:0;background:#f6f5f0;color:#67786d;border-radius:9px;padding:8px}.content-page{padding-top:16px}.page-intro{margin-bottom:23px}.page-intro h1{margin:0;font-size:29px}.page-intro p{color:var(--muted);margin:8px 0 0}.notice{border:1px solid #e7ddc6;background:#fff9eb;color:#80642e;border-radius:15px;padding:14px 16px;font-size:13px;line-height:1.5}.stack{display:grid;gap:13px}.field{display:grid;gap:6px;font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5de;background:#fff;border-radius:12px;padding:13px;color:var(--ink);outline-color:var(--green)}.field textarea{resize:vertical;min-height:75px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formcard{padding:22px}.formcard h2{margin:0 0 18px}.help{font-size:12px;color:var(--muted);line-height:1.5}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle{border:none;width:52px;height:30px;flex-shrink:0;border-radius:99px;background:#ccd4ca;position:relative}.toggle:after{content:"";width:22px;height:22px;position:absolute;left:4px;top:4px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--green)}.toggle.on:after{transform:translateX(22px)}.profilehead{display:flex;align-items:center;gap:15px}.avatar{border-radius:16px;background:#e8f2e9;color:var(--green);width:56px;height:56px;display:grid;place-items:center;font-size:25px;font-weight:900}.badge{display:inline-block;border-radius:99px;padding:5px 10px;background:#e8f4eb;color:var(--green);font-size:11px;font-weight:750}.ranking{display:grid;gap:10px}.rank{display:flex;align-items:center;gap:12px;padding:15px}.ranknum{font-size:15px;font-weight:800;color:var(--gold);width:22px}.rankname{flex:1;font-weight:750}.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty .suit{height:55px;width:48px}.hidden{display:none!important}.exportline{display:flex;flex-wrap:wrap;gap:10px}.footertext{font-size:12px;color:#829087;text-align:center;margin:24px 0}.subtle{font-size:12px;color:var(--muted)}@media(min-width:750px){.hero{padding-left:48px;padding-right:48px}.main{padding:0 40px}.dashboardgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}.kpis{grid-template-columns:repeat(3,1fr)}.nav{width:fit-content;min-width:410px;border:1px solid var(--line);border-radius:19px 19px 0 0}.balance{padding:30px}.balance strong{font-size:52px}}@media(max-width:480px){.main{padding:0 14px}.hero{padding:22px 18px 77px}.brand{font-size:17px}.balance strong{font-size:37px}.kpis{gap:8px}.kpi{padding:13px 10px}.kpi b{font-size:20px}.small{font-size:11px}.form-grid{grid-template-columns:1fr}.balancebar{align-items:flex-start}.balancebar .btn{padding:11px;font-size:12px}}
</style></head><body><div id="app" class="app"><header class="hero"><div class="top"><div class="brand"><div class="emblem" id="brandSuit"></div><span>Schafkopf <span style="color:#e4c47b">Tracker</span></span></div><div class="suite" id="suits"></div></div><h1 id="headerTitle">Servus am Kartentisch!</h1><p id="headerSub">Alle deine Schafkopfabende auf einen Blick.</p></header><main class="main" id="main"></main><nav class="nav" id="nav"></nav></div><script>
'use strict';
const icons={heart:'<path d="M50 88 C35 73 9 55 9 33 C9 11 34 2 50 23 C66 2 91 11 91 33 C91 55 65 73 50 88Z" fill="#c94f4a"/>',leaf:'<path d="M23 69 C13 39 38 15 82 12 C78 52 58 78 23 69Z" fill="#31906a"/><path d="M18 84 Q43 54 75 26" fill="none" stroke="#175b43" stroke-width="6" stroke-linecap="round"/><path d="M40 57 L26 37 M53 45 L64 58" stroke="#175b43" stroke-width="4" fill="none"/>',acorn:'<path d="M33 37 C18 52 27 80 50 89 C73 80 82 52 67 37Z" fill="#956038"/><path d="M22 38 Q28 12 50 17 Q72 12 78 38 Q52 52 22 38Z" fill="#315a3b"/><path d="M50 18 L54 8" stroke="#315a3b" stroke-width="6" stroke-linecap="round"/><path d="M34 30 Q50 24 66 30" stroke="#8ca67b" fill="none" stroke-width="4"/>',bell:'<path d="M50 11 C60 11 64 20 64 28 C64 39 79 49 80 66 L20 66 C21 49 36 39 36 28 C36 20 40 11 50 11Z" fill="#d5a439" stroke="#966b20" stroke-width="3"/><path d="M26 67 Q50 79 74 67" fill="none" stroke="#94651e" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="78" r="9" fill="#bc8b2b"/><path d="M44 24 Q50 18 56 24" stroke="#f6dfa0" stroke-width="5" stroke-linecap="round" fill="none"/>'};
const suit=(name)=>`<svg viewBox="0 0 100 100" aria-label="${{heart:'Herz',leaf:'Blatt',acorn:'Eichel',bell:'Schell'}[name]}" role="img" xmlns="http://www.w3.org/2000/svg">${icons[name]}</svg>`;
const glyph={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21v-8h6v8"/>',history:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',friends:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 16a5 5 0 0 1 4 5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',plus:'<path d="M12 5v14M5 12h14"/>'};const symbol=(x)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyph[x]}</svg>`;
const KEY='schafkopf-tracker-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{name:'',public:false,entries:[]}}catch{state={name:'',public:false,entries:[]}};if(!Array.isArray(state.entries))state.entries=[];let tab='home';const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const euro=v=>(v>0?'+':'')+new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v);const amountColor=v=>v>0?'positive':v<0?'negative':'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const datesort=(a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id));const sorted=()=>[...state.entries].sort(datesort);const total=()=>state.entries.reduce((s,e)=>s+Number(e.amount),0);const avg=()=>state.entries.length?total()/state.entries.length:0;
function chart(){const entries=sorted(),values=[0];entries.forEach(e=>values.push(values.at(-1)+Number(e.amount)));const lo=Math.min(0,...values),hi=Math.max(0,...values),range=hi-lo||1;const W=720,H=195,l=16,r=16,t=17,b=21;const x=i=>l+(W-l-r)*(values.length<2?0:i/(values.length-1));const y=v=>t+(H-t-b)*(1-(v-lo)/range);const path=values.length>1?values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' '):`M${l} ${y(0)} L${W-r} ${y(0)}`;return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Kumulierte Gewinnentwicklung"><path d="M${l} ${y(0)}H${W-r}" stroke="#b7cfc0" stroke-dasharray="6 5"/><path class="gridline" d="M${l} ${t}H${W-r} M${l} ${H-b}H${W-r}"/><path class="chartline" d="${path}"/><circle cx="${x(values.length-1)}" cy="${y(values.at(-1))}" r="5" fill="#0d7454" stroke="white" stroke-width="2"/></svg><div style="display:flex;justify-content:space-between" class="subtle"><span>Start</span><span>${entries.length?entries.length+' Spielabende':'Noch keine Einträge'}</span></div>`}
function entryrow(e){const date=new Date(e.date+'T12:00:00');return `<div class="card entry"><div class="datebadge">${date.getDate()}<small>${date.toLocaleDateString('de-DE',{month:'short'})}</small></div><div class="entryinfo"><b>${esc(e.place||'Schafkopfabend')}</b><span>${date.toLocaleDateString('de-DE')} ${e.notes?'· '+esc(e.notes):''}</span></div><span class="amount ${amountColor(e.amount)}">${euro(e.amount)}</span><button class="mini-btn" data-delete="${esc(e.id)}" title="Eintrag löschen" aria-label="Eintrag löschen">×</button></div>`}
function home(){let n=state.entries.length,won=state.entries.filter(e=>e.amount>0).length,lost=state.entries.filter(e=>e.amount<0).length;return `<section class="card balance"><div class="balancebar"><div><div class="small">Deine Gesamtbilanz</div><strong class="${amountColor(total())}">${euro(total())}</strong><div class="subtle">${n} erfasste Schafkopfabende</div></div><button class="btn" id="newEntry">+ Abend eintragen</button></div></section><div class="section kpis"><div class="card kpi"><span class="small">Ø pro Abend</span><b class="${amountColor(avg())}">${euro(avg())}</b></div><div class="card kpi"><span class="small">Im Plus</span><b>${won}</b></div><div class="card kpi"><span class="small">Im Minus</span><b>${lost}</b></div></div><div class="dashboardgrid"><section class="section"><div class="sectionhead"><h2>Gewinnentwicklung</h2><span class="subtle">Kumuliert</span></div><div class="card chartcard">${chart()}</div></section><section class="section"><div class="sectionhead"><h2>Letzte Spielabende</h2><button class="btn ghost" data-tab="history" style="padding:9px 12px;font-size:12px">Alle ansehen →</button></div><div class="list">${sorted().reverse().slice(0,4).map(entryrow).join('')||`<div class="card empty">${suit('bell')}<p>Trage deinen ersten Schafkopfabend ein.</p></div>`}</div></section></div>`}
function history(){return `<div class="content-page"><div class="page-intro"><h1>Deine Spielabende</h1><p>Jeder Abend zählt. Erfasse Gewinne und Verluste.</p></div><section class="card formcard"><h2>Neuen Abend eintragen</h2><form id="entryForm" class="stack"><div class="form-grid"><label class="field">Datum<input type="date" id="date" required></label><label class="field">Ergebnis<select id="resultType" aria-label="Gewinn oder Verlust"><option value="1">Gewinn (+)</option><option value="-1">Verlust (−)</option></select></label><label class="field">Betrag (€)<input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="z. B. 3,50" required></label></div><label class="field">Ort / Runde (optional)<input id="place" maxlength="80" placeholder="z. B. Stammtisch"></label><label class="field">Notiz (optional)<textarea id="notes" maxlength="160" placeholder="Was war heute besonders?"></textarea></label><div><button type="submit" class="btn">Abend speichern</button></div></form></section><section class="section"><div class="sectionhead"><h2>Verlauf (${state.entries.length})</h2></div><div class="list">${sorted().reverse().map(entryrow).join('')||'<div class="card empty">Noch keine Abende erfasst.</div>'}</div></section></div>`}
function friends(){return `<div class="content-page"><div class="page-intro"><h1>Freunde & Rangliste</h1><p>Gemeinsam spielen, Erfolge vergleichen.</p></div><div class="notice"><b>Vorschau – noch nicht online.</b> Die Freundesrangliste enthält ausschließlich fiktive Beispieldaten. Es werden keine privaten Daten veröffentlicht. Für echte Profile, Freigaben und Vergleiche wird später ein Login mit Datenbank benötigt.</div><section class="section"><div class="sectionhead"><h2>So könnte eure Rangliste aussehen</h2><span class="badge">Demo</span></div><div class="ranking">${[['Lena',42.8],['Max',21.4],['Jonas',-3.2],['Tobi',-15.6]].map(([name,am],i)=>`<div class="card rank"><div class="ranknum">${i+1}.</div><div class="avatar" style="width:42px;height:42px;font-size:17px">${name[0]}</div><div class="rankname">${name}</div><span class="amount ${amountColor(am)}">${euro(am)}</span></div>`).join('')}</div></section><section class="section card formcard"><h2>Geplante Privatsphäre</h2><p class="help">Jeder Nutzer entscheidet selbst, ob seine Statistik öffentlich, nur für bestätigte Freunde oder privat sichtbar ist. Standardmäßig ist alles privat. Diese Version speichert deine Auswahl ausschließlich auf deinem Gerät.</p></section></div>`}
function profile(){return `<div class="content-page"><div class="page-intro"><h1>Mein Profil</h1><p>Dein Kartentisch, deine Regeln.</p></div><section class="card formcard stack"><div class="profilehead"><div class="avatar">${esc((state.name||'S').trim().charAt(0).toUpperCase())}</div><div><b>${esc(state.name||'Schafkopf-Spieler')}</b><div class="small">Lokales Profil auf diesem Gerät</div></div></div><label class="field">Dein Spielername<input id="profileName" maxlength="40" value="${esc(state.name)}" placeholder="z. B. Felix"></label><div><button class="btn" id="saveName">Namen speichern</button></div></section><section class="section card formcard stack"><h2>Statistik-Sichtbarkeit</h2><div class="switchrow"><div><b>Meine Statistik öffentlich</b><p class="help">Einstellung für die spätere Online-Version. Standard: privat.</p></div><button id="visibility" class="toggle ${state.public?'on':''}" role="switch" aria-checked="${state.public}" aria-label="Öffentliche Statistik ${state.public?'deaktivieren':'aktivieren'}"></button></div><div class="notice">Aktuell bleiben deine Daten immer lokal auf diesem Gerät. Auch bei aktiviertem Schalter werden keine Informationen ins Internet übertragen.</div></section><section class="section card formcard stack"><h2>Datensicherung</h2><p class="help">Exportiere alle deine Spielabende als JSON-Datei oder importiere eine frühere Sicherung. Nützlich beim Handywechsel.</p><div class="exportline"><button class="btn secondary" id="export">Daten exportieren</button><label class="btn ghost" style="display:inline-block">Daten importieren <input type="file" id="import" accept="application/json,.json" style="display:none"></label></div></section></div>`}
function render(){document.getElementById('brandSuit').innerHTML=suit('acorn');document.getElementById('suits').innerHTML=['bell','acorn','leaf','heart'].map(x=>`<span class="suit">${suit(x)}</span>`).join('');document.getElementById('headerTitle').textContent=tab==='home'?'Servus '+(state.name?state.name+'!':'am Kartentisch!'):({'history':'Gut Blatt!','friends':'Zusammen am Tisch.','profile':'Dein Spielerprofil.'}[tab]);document.getElementById('headerSub').textContent=({'home':'Alle deine Schafkopfabende auf einen Blick.','history':'Schau zurück auf deine Runden.','friends':'Ein Blick auf die zukünftige Community.','profile':'Du bestimmst, was sichtbar ist.'}[tab]);document.getElementById('main').innerHTML=({home,history,friends,profile})[tab]();document.getElementById('nav').innerHTML=[['home','Dashboard','home'],['history','Abende','history'],['friends','Freunde','friends'],['profile','Profil','user']].map(([id,label,ico])=>`<button data-tab="${id}" class="${id===tab?'active':''}" aria-label="${label}">${symbol(ico)}${label}</button>`).join('');if(tab==='history')document.getElementById('date').value=new Date().toLocaleDateString('en-CA');}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-tab]');if(btn){tab=btn.dataset.tab;render();window.scrollTo(0,0);return}if(e.target.closest('#newEntry')){tab='history';render();window.scrollTo(0,0);document.querySelector('#amount').focus();return}let del=e.target.closest('[data-delete]');if(del){if(confirm('Diesen Schafkopfabend wirklich löschen?')){state.entries=state.entries.filter(x=>String(x.id)!==del.dataset.delete);persist();render()}return}if(e.target.closest('#saveName')){state.name=document.getElementById('profileName').value.trim();persist();render();return}if(e.target.closest('#visibility')){state.public=!state.public;persist();render();return}if(e.target.closest('#export')){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),profile:state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='schafkopf-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();const rawAmount=Number(document.getElementById('amount').value),amount=rawAmount*Number(document.getElementById('resultType').value),date=document.getElementById('date').value;if(!Number.isFinite(rawAmount)||rawAmount<0||!/^\d{4}-\d\d-\d\d$/.test(date))return;state.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date,amount,place:document.getElementById('place').value.trim(),notes:document.getElementById('notes').value.trim()});persist();render()}});
document.addEventListener('change',async e=>{if(e.target.id==='import'){const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text()),incoming=obj.profile||obj;if(!Array.isArray(incoming.entries)||incoming.entries.some(x=>typeof x.date!=='string'||!Number.isFinite(Number(x.amount))))throw Error('Ungültiges Format');if(!confirm('Aktuelle Daten durch diese Sicherung ersetzen?'))return;state={name:String(incoming.name||'').slice(0,40),public:!!incoming.public,entries:incoming.entries.map((x,i)=>({id:String(x.id||i),date:x.date,amount:Number(x.amount),place:String(x.place||'').slice(0,80),notes:String(x.notes||'').slice(0,160)}))};persist();render();alert('Import erfolgreich.')}catch{alert('Die Sicherung konnte nicht geladen werden.')}}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
