/* v1.2: Mobile Ansicht – lange Rundennamen dürfen nicht die Seitenbreite verändern. */
html,body{max-width:100%;overflow-x:clip}
.app,.main,.hero,.dashboardgrid,.section,.card,.list{min-width:0}
.app{width:100%}
.list{grid-template-columns:minmax(0,1fr)}
.entryinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amount{white-space:nowrap}
.balancebar>div{min-width:0}
.balance strong{overflow-wrap:anywhere}
.kpi b{overflow-wrap:anywhere}
@media(max-width:650px){
 .entry{display:grid;grid-template-columns:56px minmax(0,1fr) 34px;grid-template-rows:auto auto;grid-template-areas:"date info remove" "date amount remove";column-gap:12px;row-gap:3px;padding:12px;align-items:center;width:100%}
 .entry .datebadge{grid-area:date;min-width:0;width:56px;align-self:center}
 .entry .entryinfo{grid-area:info;min-width:0;max-width:100%;width:100%}
 .entry .amount{grid-area:amount;justify-self:start;font-size:14px}
 .entry .mini-btn{grid-area:remove;min-width:34px;height:36px;justify-self:end}
}
@media(max-width:480px){
 .brand{font-size:clamp(13px,3.8vw,17px);gap:7px;white-space:nowrap}
 .emblem{width:38px;height:38px;flex:0 0 38px}
 .suite{gap:0;flex-shrink:0}
 .suite .suit{width:clamp(16px,5vw,25px);height:26px}

@media(max-width:350px){.balancebar{flex-wrap:wrap}.balancebar .btn{width:100%}}

/* v1.5: Nur die Dashboard-Bilanz liegt auf dem grünen Kopfbereich. */
.app.is-subpage .hero{padding-bottom:30px}
.app.is-subpage .main{margin-top:0}

/* Die Jahresauswahl muss sich auf schmalen Smartphones umbrechen koennen. */
.stats-heading{flex-wrap:wrap;align-items:center;gap:12px}
.stats-heading h2{flex:1 1 210px;min-width:0;line-height:1.2;overflow-wrap:normal}

@media(max-width:360px){.stats-heading h2{flex-basis:100%}.stats-heading .year-picker{margin-left:0}}

.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-option input{position:absolute;opacity:0;pointer-events:none}
.mode-option{position:relative}
.mode-card{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid #d7e3d8;background:#f6f8f5;color:#315447;border-radius:14px;font-weight:800;cursor:pointer;text-align:center}
.mode-option input:checked + .mode-card{background:#0d7454;color:#fff;border-color:#0d7454}
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game-option input{position:absolute;opacity:0;pointer-events:none}
.game-option{position:relative}
.game-card{border:1px solid #d7e3d8;border-radius:16px;background:linear-gradient(180deg,#fafbfa,#f1f4f0);padding:11px 8px;display:grid;gap:8px;min-height:110px;align-items:center;justify-items:center;text-align:center;box-shadow:0 4px 12px rgba(11,46,33,.04);cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow}
.game-card .gico{width:50px;height:38px;color:#203a31;display:grid;place-items:center}
.game-card .gico svg{width:100%;height:100%}
.game-card .glabel{font-size:12px;font-weight:800;line-height:1.15}
.game-option input:checked + .game-card{border-color:#c39a43;box-shadow:0 8px 20px rgba(195,154,67,.20);background:linear-gradient(180deg,#fffdf7,#f8f0dd);transform:translateY(-1px)}
.game-option input:focus-visible + .game-card{outline:3px solid #c39a43;outline-offset:2px}
.form-hint{font-size:12px;color:var(--muted);margin-top:-4px}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.small-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;background:#edf5ee;color:#315447;font-size:11px;font-weight:800;line-height:1}

.game-type-list{display:grid;gap:10px}
.game-type-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,.8fr));gap:10px;align-items:center;padding:13px 14px}

.game-type-cell{min-width:0;font-size:13px}
.game-type-main{display:flex;align-items:center;gap:10px;min-width:0}
.game-type-main .gico{width:38px;height:30px;flex:0 0 38px}
.game-type-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-type-main small{display:block;color:var(--muted);font-size:11px}

@media(max-width:760px){.game-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-type-row{grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));grid-template-areas:"main count total" "main wl avg";row-gap:6px}.game-type-row .main{grid-area:main}.game-type-row .count{grid-area:count}.game-type-row .total{grid-area:total}.game-type-row .wl{grid-area:wl}.game-type-row .avg{grid-area:avg}.game-type-row .rate{display:none}.game-type-head{display:none}}

/* v1.7 – schnell bedienbare, klar getrennte Ansicht */
.hero{padding-bottom:65px}
.app.is-subpage .hero{padding-bottom:26px}
.game-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:18px;box-shadow:var(--shadow)}

.game-fast-panel{padding:18px 15px}
.game-fast-panel .sectionhead{margin-bottom:16px}
.fast-game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.game-select{min-width:0;border:1.5px solid #d9e3d9;border-radius:12px;background:linear-gradient(180deg,#fbfcfa,#eff4ed);color:#213d32;padding:9px 3px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-height:78px;font-size:11px;line-height:1.2;font-weight:800;text-align:center}

</style></head><body><div id="app" class="app"><header class="hero"><div class="top"><div class="brand"><div class="emblem" id="brandSuit"></div><span>Schafkopf<span style="color:#e4c47b">tracker</span></span></div><div class="suite" id="suits"></div></div><h1 id="headerTitle">Servus am Kartentisch!</h1><p id="headerSub">Alle deine Schafkopfabende auf einen Blick.</p></header><main class="main" id="main"></main><nav class="nav" id="nav"></nav><div id="toast" class="hidden" role="status" aria-live="polite"></div><div id="updateBanner" class="update-banner hidden" role="status" aria-live="polite"><div class="update-text"><b>🃏 Neue Version verfügbar!</b><p>Ein Update ist bereit. Deine gespeicherten Spielabende bleiben erhalten.</p></div><button type="button" class="btn" id="applyUpdate">Aktualisieren</button><button type="button" class="mini-btn" id="dismissUpdate" aria-label="Später aktualisieren" title="Später">✕</button></div></div><script>
'use strict';
/* Schafkopftracker v1.7 – Offline und nur lokal. */

const suit=(name)=>`<svg viewBox="0 0 100 100" aria-label="${{heart:'Herz',leaf:'Blatt',acorn:'Eichel',bell:'Schell'}[name]}" role="img" xmlns="http://www.w3.org/2000/svg">${icons[name]}</svg>`;
const glyph={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21v-8h6v8"/>',history:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',friends:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 16a5 5 0 0 1 4 5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',plus:'<path d="M12 5v14M5 12h14"/>'};glyph.stats='<path d="M4 20V13M10 20V9M16 20V4M22 20H2"/>';const symbol=(x)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyph[x]}</svg>`;

const GAME_TYPES=[

  bettel:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><circle cx="31" cy="13" r="6"/><path d="M18 37c2-8 7-12 13-12s11 4 13 12"/><path d="M23 27h17"/><path d="M44 13 55 24"/><path d="M48 11h8v8"/></svg>`,
  hochzeit:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="15" r="6"/><circle cx="40" cy="15" r="6"/><path d="M13 35c2-8 7-12 10-12 4 0 8 4 10 12"/><path d="M30 35c2-8 7-12 10-12 4 0 8 4 10 12"/><path d="M31 7h18m-9-4v8"/></svg>`,
  ramsch:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="22" r="5"/><circle cx="32" cy="16" r="5"/><circle cx="46" cy="22" r="5"/><path d="M11 36c1-5 4-8 7-8s6 3 7 8"/><path d="M25 30c1-5 4-8 7-8s6 3 7 8"/><path d="M39 36c1-5 4-8 7-8s6 3 7 8"/><path d="M26 8l12 16m0-16-12 16"/></svg>`,
  hirsch:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><path d="M32 34c-6 0-11-5-11-11 0-6 5-11 11-11s11 5 11 11c0 6-5 11-11 11Z"/><path d="M28 13 22 6m1 7-7-2m24 2 6-7m-1 7 7-2"/><path d="M28 35v5m8-5v5"/></svg>`,
  kreuzrunde:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="12" r="5"/><circle cx="14" cy="22" r="5"/><circle cx="50" cy="22" r="5"/><circle cx="32" cy="33" r="5"/><path d="M32 18v9M20 22h24M18 18l10-6m18 6-10-6m-18 8 10 7m18-7-10 7"/></svg>`,
  bockrunde:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><path d="M21 17c0-6 5-10 11-10s11 4 11 10v7c0 7-5 13-11 13s-11-6-11-13Z"/><path d="M21 16c-5 0-8-4-8-8 4 0 8 2 10 6m22 2c5 0 8-4 8-8-4 0-8 2-10 6"/><path d="M27 23h0m10 0h0"/><path d="M28 30c2 2 6 2 8 0"/></svg>`,
  training:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="36" height="26" rx="4"/><path d="M20 15h24M20 22h17M20 29h13"/><path d="m47 31 5 5"/></svg>`,
  kurz:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="18" height="24" rx="4" transform="rotate(-8 7 10)"/><rect x="23" y="10" width="18" height="24" rx="4"/><path d="M12 18h8m-8 6h8M28 18h8m-8 6h8"/><path d="M44 12h10m-5-5v10"/></svg>`,
  legen:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="18" height="24" rx="4" transform="rotate(-10 7 10)"/><rect x="23" y="8" width="18" height="24" rx="4"/><rect x="39" y="10" width="18" height="24" rx="4" transform="rotate(10 39 10)"/></svg>`,
  anderes:`<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="22" r="10"/><path d="M33.5 29.5 43 39"/><path d="M26 17v6m0 6h.01"/></svg>`
 };
 return icons[id]||icons.anderes;
}
function gameLabel(id){return (GAME_MAP[id]||GAME_MAP.anderes).label;}

/* Eigene Kartenillustrationen, angelehnt an bayerische Spielkarten – keine kopierten App-Assets. */
function richGameIcon(id){
 const card=(x,y,angle,suit,color,mark='A')=>`<g transform="translate(${x} ${y}) rotate(${angle} 16 23)"><rect x="0" y="0" width="32" height="45" rx="4" fill="#fffefa" stroke="#bfc6c1" stroke-width="1.3"/><text x="4" y="10" font-size="9" font-weight="900" fill="${color}">${mark}</text><text x="16" y="32" text-anchor="middle" font-size="19" fill="${color}">${suit}</text></g>`;
 const suits={heart:'♥',leaf:'♠',acorn:'♣',bell:'♦'};
 let drawing='';
 switch(id){
  case 'rufspiel': drawing=card(9,11,-13,suits.heart,'#d92336')+card(35,10,12,suits.acorn,'#168146');break;
  case 'solo': drawing=card(24,7,-3,suits.heart,'#dd273e')+'<text x="66" y="19" font-size="17">★</text>';break;
  case 'wenz': drawing=card(7,12,-13,suits.heart,'#cd2c3a','U')+card(33,9,0,suits.acorn,'#16713e','U')+card(55,15,15,suits.bell,'#ca9930','U');break;
  case 'farbwenz': drawing=card(7,12,-13,suits.heart,'#cd2c3a','U')+card(33,9,0,suits.acorn,'#16713e','U')+card(55,15,15,suits.bell,'#ca9930','U');break;
  case 'geier':drawing='<text x="45" y="49" text-anchor="middle" font-size="47">🦅</text>';break;
  case 'farbgeier':drawing='<text x="46" y="49" text-anchor="middle" font-size="46">🦅</text>'+ '<circle cx="73" cy="14" r="10" fill="#f8f2dc"/><text x="73" y="19" text-anchor="middle" font-size="13" fill="#d52b40">♥</text>';break;
  case 'bettel':drawing='<text x="45" y="47" text-anchor="middle" font-size="42">🙋</text>';break;
  case 'ramsch':drawing='<text x="46" y="43" text-anchor="middle" font-size="39">👥</text><path d="M25 22L66 47 M66 22L25 47" stroke="#dc2c44" stroke-width="7" stroke-linecap="round"/>';break;
  case 'hochzeit': drawing='<text x="45" y="46" text-anchor="middle" font-size="42">💍</text>';break;
  case 'hirsch': drawing='<text x="46" y="45" text-anchor="middle" font-size="43">🦌</text>';break;
  case 'bockrunde':drawing='<text x="46" y="45" text-anchor="middle" font-size="42">🐐</text>';break;
  case 'kreuzrunde':drawing='<text x="46" y="43" text-anchor="middle" font-size="40">✣</text>';break;
  case 'kurz': drawing=card(7,9,-10,'7','#28302e','7')+card(38,10,12,'8','#28302e','8');break;
  case 'legen':drawing=card(8,14,-17,'✦','#1a6c9a')+card(29,9,0,'✦','#1a6c9a')+card(52,14,17,'✦','#1a6c9a');break;
  case 'training':drawing=card(9,12,-11,'♢','#889192')+card(39,11,9,'♢','#889192');break;
  case 'sie':drawing=card(7,12,-12,suits.heart,'#d92336','O')+card(33,8,0,suits.acorn,'#158144','O')+card(55,13,12,suits.leaf,'#222','U');break;
  case 'tout':drawing=card(24,10,-7,suits.leaf,'#147744')+'<circle cx="70" cy="44" r="12" fill="#d83340"/><text x="70" y="49" text-anchor="middle" font-size="18" font-weight="900" fill="white">!</text>';break;
  default:drawing=card(26,10,-5,'?','#44746b');
 }
 return `<svg viewBox="0 0 92 68" role="img" aria-label="${gameLabel(id)}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-${id}" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#3b3e3e"/><stop offset="1" stop-color="#101615"/></linearGradient></defs><rect x="1" y="1" width="90" height="66" rx="12" fill="url(#grad-${id})"/><g>${drawing}</g></svg>`;
}

function normalizeEntry(e){const today=new Date();const fallbackDate=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');const fallbackId='id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);return {
  id:String(e.id||fallbackId).slice(0,90),
  date:String(e.date||fallbackDate),
  amount:Math.round(Number(e.amount||0)*100)/100,
  place:String(e.place||'').slice(0,80),
  notes:String(e.notes||'').slice(0,160),
  kind:e.kind==='game'?'game':'session',
  gameType:GAME_MAP[e.gameType]?e.gameType:''
 };}

const VERSION='2.2';
const KEY='schafkopf-tracker-v1'; // unveraendert seit v1.1
const defaultRates=()=>({rufspiel:10,solo:50,bettel:50,hochzeit:20,kreuzrunde:20,ramsch:10,schneider:10,schwarz:10,laeufer:10});
const defaultRules=()=>({allowSchuss:false,allowKontra:false,rufMinRunners:3});
const defaultState=()=>({name:'',public:false,entries:[],goalTarget:0,showGoal:false,lastBackupAt:'',lastBackupCount:0,rates:defaultRates(),rules:defaultRules()});
let state=defaultState();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'&&!Array.isArray(saved))state={...defaultState(),...saved};}catch(err){console.warn('Lokale Daten konnten nicht gelesen werden.',err);}
if(!Array.isArray(state.entries))state.entries=[];
state.rates={...defaultRates(),...(state.rates&&typeof state.rates==='object'?state.rates:{})};
state.rules={...defaultRules(),...(state.rules&&typeof state.rules==='object'?state.rules:{})};
const fmtEUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const euro=n=>(n>0?'+':'')+fmtEUR.format(n);
const normalEUR=n=>fmtEUR.format(n);
const amountColor=n=>n>0?'positive':n<0?'negative':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
const thisYear=()=>new Date().getFullYear();
const validDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return Number.isFinite(d.getTime())&&[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===s;};
const parseAmount=s=>{const v=String(s??'').trim().replace(',','.');return /^\d+(?:\.\d{1,2})?$/.test(v)?Math.round(Number(v)*100)/100:NaN;};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const normEntry=(e,i)=>({id:String(e.id||('import-'+i+'-'+uid())).slice(0,90),date:e.date,amount:Math.round(Number(e.amount)*100)/100,place:String(e.place||'').slice(0,80),notes:String(e.notes||'').slice(0,160),kind:e.kind==='game'?'game':'session',gameType:e.kind==='game'&&GAME_MAP[e.gameType]?e.gameType:'',scoreData:e.kind==='game'&&e.scoreData&&typeof e.scoreData==='object'?{...e.scoreData}:null});
state.entries=state.entries.filter(e=>e&&typeof e.date==='string'&&validDate(e.date)&&Number.isFinite(Number(e.amount))).map(normEntry);
/* Alle gespeicherten Abende bleiben manuell. Automatische Abendzeilen werden
   aus Einzelspielen on demand berechnet und NICHT im LocalStorage dupliziert. */
const manualSessionEntries=()=>state.entries.filter(e=>e.kind!=='game');
const gameEntries=()=>state.entries.filter(e=>e.kind==='game');
function autoSessionEntries(){
 const manualDates=new Set(manualSessionEntries().map(e=>e.date));
 const byDay=new Map();
 for(const game of gameEntries()){
  if(manualDates.has(game.date))continue; // manuelle Tagesbilanz hat Vorrang; keine doppelte Wertung
  if(!byDay.has(game.date))byDay.set(game.date,{date:game.date,amountCents:0,count:0});
  const day=byDay.get(game.date);
  day.amountCents+=Math.round(Number(game.amount)*100);
  day.count++;
 }
 return Array.from(byDay.values()).map(day=>({
  id:'automatic-day-'+day.date,date:day.date,kind:'session',auto:true,
  gameCount:day.count,amount:day.amountCents/100,
  place:'Aus Einzelspielen',notes:'',gameType:'',scoreData:null
 }));
}
const sessionEntries=()=>[...manualSessionEntries(),...autoSessionEntries()];
const sortDate=(a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id));
const sorted=(entries)=>[...entries].sort(sortDate);
const total=(arr)=>Math.round(arr.reduce((s,e)=>s+Number(e.amount),0)*100)/100;
const summary=(arr)=>({count:arr.length,amount:total(arr),won:arr.filter(e=>e.amount>0).length,lost:arr.filter(e=>e.amount<0).length});
const labelDate=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const mon=m=>new Date(2024,m,1).toLocaleDateString('de-DE',{month:'short'});
const fp=e=>JSON.stringify([e.date,Number(e.amount),e.place||'',e.notes||'',e.kind||'session',e.gameType||'',e.scoreData?JSON.stringify(e.scoreData):'']);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(err){alert('Speichern fehlgeschlagen. Bitte den freien Gerätespeicher prüfen.');return false;}}
let tab='home',editId=null,chartRange='all',chartSelected=null,selectedYear=thisYear(),importCandidate=null;
let quickType='rufspiel',quickSign=1,quickAmount='',moreTypes=false,showAllGames=false;
let toastTimeout=null;
function flash(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2300);}
function switchTab(next){if(next!=='games')pendingStitchArchive=null;tab=next;editId=null;chartSelected=null;render();scrollTo({top:0,behavior:'instant'});}
function periodEntries(year){return sorted(sessionEntries()).filter(e=>e.date.startsWith(String(year)+'-'));}
function years(){return [...new Set([...sessionEntries().map(e=>Number(e.date.slice(0,4))),thisYear()])].filter(Number.isFinite).sort((a,b)=>b-a);}
function months(year){return Array.from({length:12},(_,m)=>{const arr=periodEntries(year).filter(e=>Number(e.date.slice(5,7))===m+1);return {m,count:arr.length,amount:total(arr)};});}
function runStats(){const arr=sorted(sessionEntries());let win=0,loss=0,bestWin=0,bestLoss=0;for(const e of arr){win=e.amount>0?win+1:0;loss=e.amount<0?loss+1:0;bestWin=Math.max(win,bestWin);bestLoss=Math.max(loss,bestLoss);}return {bestWin,bestLoss,best:arr.filter(e=>e.amount>0).sort((a,b)=>b.amount-a.amount)[0],worst:arr.filter(e=>e.amount<0).sort((a,b)=>a.amount-b.amount)[0]};}
function gameStats(){const games=gameEntries();return [...GAME_TYPES,...RETIRED_GAME_TYPES].map(g=>{const arr=games.filter(e=>e.gameType===g.id),s=summary(arr);return {...s,id:g.id,label:g.label,avg:s.count?s.amount/s.count:0,rate:(s.won+s.lost)?s.won/(s.won+s.lost)*100:0};}).filter(x=>x.count).sort((a,b)=>b.count-a.count||b.amount-a.amount);}
function card(label,value,details='',cls=''){return `<div class="card stat-card"><div class="small">${label}</div><b class="${cls}">${value}</b>${details?`<p class="help">${details}</p>`:''}</div>`;}
function goalUI(){const goal=Number(state.goalTarget)||0,bal=total(periodEntries(thisYear())),pct=goal?Math.max(0,Math.min(100,bal/goal*100)):0;return `<div class="goal-header"><div><div class="small">Jahresziel ${thisYear()}</div><b class="goal-current ${amountColor(bal)}">${euro(bal)}</b></div><span class="goal-target">${goal?`Ziel ${normalEUR(goal)}`:'Noch kein Ziel gesetzt'}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div style="width:${pct}%"></div></div><div class="help">${goal?(bal>=goal?'Ziel erreicht!':`${Math.round(pct)} % erreicht`):'Trage unten dein freiwilliges Ziel ein.'}</div>`;}
function bestOf(){const gs=gameStats();return {most:gs[0],best:gs.slice().sort((a,b)=>b.amount-a.amount)[0],bestAvg:gs.filter(g=>g.count>=3).sort((a,b)=>b.avg-a.avg)[0]};}
function chartPoints(){const items=sorted(sessionEntries()),period=nowISO().slice(0,7);let acc=0;const all=items.map(e=>({...e,cumulative:(acc=Math.round((acc+e.amount)*100)/100)}));const shown=chartRange==='last10'?all.slice(-10):chartRange==='month'?all.filter(e=>e.date.startsWith(period)):all;const start=shown.length?Math.round((shown[0].cumulative-shown[0].amount)*100)/100:0;return {shown,start};}
function axisTicks(a,b){const low=a===b?a-1:a,hi=a===b?b+1:b,rough=(hi-low)/4,order=Math.pow(10,Math.floor(Math.log10(rough||1))),step=([1,2,2.5,5,10].find(v=>v*order>=rough)||10)*order;const bottom=Math.floor(low/step)*step,top=Math.ceil(hi/step)*step,vals=[];for(let i=0;i<=10;i++){const v=bottom+i*step;if(v>top+step*.0001)break;vals.push(+v.toFixed(4));}return {bottom,top,vals};}
function chart(){const {shown,start}=chartPoints(),vals=[start,...shown.map(p=>p.cumulative)];const a=axisTicks(Math.min(0,...vals),Math.max(0,...vals)),W=700,H=210,L=12,R=10,T=17,B=17;const x=i=>L+(W-L-R)*(vals.length<2?0:i/(vals.length-1)),y=v=>T+(H-T-B)*(1-(v-a.bottom)/(a.top-a.bottom||1));const path=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ');const labels=a.vals.map(v=>`<span class="tick ${v===0?'zero':''}" style="top:${y(v)/H*100}%">${(v>0?'+':'')+new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(v)} €</span>`).join('');const i=chartSelected===null?shown.length:Math.max(0,Math.min(shown.length,chartSelected)),p=shown[i-1],value=i?p.cumulative:start;const dots=shown.map((q,j)=>`<circle cx="${x(j+1)}" cy="${y(q.cumulative)}" r="${i===j+1?5:3}" fill="#0d7454" stroke="white" stroke-width="2"/><circle tabindex="0" role="button" aria-label="Abend ${j+1} wählen" class="chart-hit" data-point="${j+1}" cx="${x(j+1)}" cy="${y(q.cumulative)}" r="${Math.max(8,Math.min(15,280/Math.max(1,shown.length)))}" fill="transparent"/>`).join('');
return `<div class="chart-toolbar">${[['all','Gesamt'],['last10','Letzte 10'],['month','Monat']].map(([id,label])=>`<button type="button" class="chip ${chartRange===id?'chosen':''}" data-chart-range="${id}">${label}</button>`).join('')}</div><div class="chart-wrap"><div class="chart-y-axis" aria-hidden="true">${labels}</div><svg class="chart chart-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Abendbilanz mit Euro-Skala">${a.vals.map(v=>`<path d="M${L} ${y(v)}H${W-R}" class="gridline"/>`).join('')}<path class="chartline" d="${vals.length>1?path:`M${L} ${y(start)}H${W-R}`}"/>${dots}</svg></div><div class="chart-inspector"><b>${p?labelDate(p.date):'Zeitraumbeginn'}</b><span class="amount ${amountColor(value)}"> ${euro(value)} Gesamtstand</span>${p?`<p class="help">Abend: ${euro(p.amount)}</p>`:''}</div>${shown.length?`<input id="chartScrub" type="range" min="0" max="${shown.length}" value="${i}" aria-label="Spielabend im Diagramm auswählen">`:'<p class="help">Trage deinen ersten Schafkopfabend ein.</p>'}`;}
function simpleRow(e){const date=new Date(e.date+'T12:00:00');const name=e.auto?'Automatischer Spielabend':e.kind==='game'?gameLabel(e.gameType):e.place||'Schafkopfabend';return `<div class="card entry ${e.auto?'auto-entry':''}"><div class="datebadge">${date.getDate()}<small>${date.toLocaleDateString('de-DE',{month:'short'})}</small></div>${e.kind==='game'?`<div class="history-game-icon">${richGameIcon(e.gameType)}</div>`:''}<div class="entryinfo"><b title="${esc(name)}">${esc(name)}</b><span>${labelDate(e.date)}${e.auto?` · ${e.gameCount} ${e.gameCount===1?'Einzelspiel':'Einzelspiele'}`:''}${e.kind==='game'&&e.scoreData?` · ${e.gameType==='bettel'?e.scoreData.tricks+' Ansager-Stiche':e.gameType==='ramsch'?e.scoreData.points+' Punkte, '+e.scoreData.jungfrau+' Jungfrauen':e.scoreData.points+' Punkte'} · Spielpreis ${normalEUR(e.scoreData.price)}`:''}${e.place&&e.kind==='game'?' · '+esc(e.place):''}${e.notes?' · '+esc(e.notes):''}</span>${e.auto?'<span class="origin-label automatic">↻ Automatisch aus Spielen</span>':e.kind==='session'?'<span class="origin-label">Manuell erfasst</span>':''}</div><span class="amount ${amountColor(e.amount)}">${euro(e.amount)}</span><div class="entry-actions">${e.auto?'<button type="button" class="mini-btn auto-open" data-tab="games" title="Einzelspiele ansehen" aria-label="Einzelspiele ansehen">↗</button>':`<button class="mini-btn" data-edit="${esc(e.id)}" title="Bearbeiten" aria-label="Eintrag bearbeiten">✎</button><button class="mini-btn" data-delete="${esc(e.id)}" title="Löschen" aria-label="Eintrag löschen">×</button>`}</div></div>`;}
function list(arr,count=arr.length){return `<div class="list">${sorted(arr).reverse().slice(0,count).map(simpleRow).join('')||'<div class="card empty">Noch keine Einträge vorhanden.</div>'}</div>`;}
function home(){const s=summary(sessionEntries()),g=summary(gameEntries()),a=autoSessionEntries().length;return `<section class="card balance"><div class="balancebar"><div><div class="small">Deine Abend-Bilanz</div><strong class="${amountColor(s.amount)}">${euro(s.amount)}</strong><div class="subtle">${s.count} Schafkopfabende${a?' · '+a+' automatisch':''}</div></div><button class="btn" data-tab="history">+ Abend</button></div></section><section class="section"><div class="sectionhead"><h2>Einzelspiele</h2><button class="btn ghost small-button" data-tab="games">+ Spiel erfassen →</button></div><div class="game-summary card"><div><div class="small">Spiel-Bilanz</div><b class="${amountColor(g.amount)}">${euro(g.amount)}</b></div><div><div class="small">Spiele</div><b>${g.count}</b></div><div><div class="small">Gewonnen</div><b>${g.won}</b></div></div><p class="inline-note">Die Einzelspiele werden pro Datum automatisch in die Abendbilanz übernommen – nicht zusätzlich gezählt.</p></section><section class="section"><div class="sectionhead"><h2>Gewinnentwicklung der Abende</h2><span class="subtle">Kumuliert</span></div><div id="chartContainer" class="card chartcard">${chart()}</div></section><section class="section"><div class="sectionhead"><h2>Letzte Abende</h2><button class="btn ghost small-button" data-tab="history">Alle →</button></div>${list(sessionEntries(),3)}</section>${backupReminder()?`<div class="section notice">${backupReminder()}</div>`:''}`;}
function history(){const editing=state.entries.find(e=>e.id===editId&&e.kind==='session');return `<div class="content-page"><div class="notice session-notice"><b>Deine Abende entstehen automatisch.</b> Alle Einzelspiele eines Datums werden zu einem Abend zusammengefasst. Wenn du ohne Einzelspiel-Tracker spielst, kannst du hier wie bisher deinen Abend manuell eintragen. Ein manueller Abend am selben Datum hat Vorrang, damit die Bilanz nicht doppelt zählt.</div><section class="section card formcard"><h2>${editing?'Abend bearbeiten':'Abend manuell eintragen'}</h2><form id="sessionForm" class="stack"><label class="field">Datum<input type="date" id="date" required value="${editing?editing.date:nowISO()}"></label><p id="manualDateInfo" class="manual-date-info hidden" role="status"></p><div class="field"><span>Ergebnis</span><div class="result-toggle"><button type="button" class="result-btn ${!editing||editing.amount>=0?'selected win':''}" data-session-sign="1">+ Gewinn</button><button type="button" class="result-btn ${editing?.amount<0?'selected loss':''}" data-session-sign="-1">− Verlust</button></div><input type="hidden" id="resultType" value="${editing?.amount<0?-1:1}"></div><label class="field">Betrag (€)<input type="text" id="amount" inputmode="decimal" placeholder="z. B. 3,50" required value="${editing?Math.abs(editing.amount).toFixed(2).replace('.',','):''}"></label><details class="advanced" ${editing?.place||editing?.notes?'open':''}><summary>Ort und Notiz (optional)</summary><div class="stack"><label class="field">Ort / Runde<input id="place" maxlength="80" value="${esc(editing?.place||'')}" placeholder="z. B. Hütte"></label><label class="field">Notiz<textarea id="notes" maxlength="160">${esc(editing?.notes||'')}</textarea></label></div></details><button type="submit" class="btn primary-full">${editing?'Änderung speichern':'Abend speichern'}</button>${editing?'<button class="btn ghost" type="button" id="cancelEdit">Abbrechen</button>':''}<p class="help" id="entryError" role="alert"></p></form></section><section class="section"><div class="sectionhead"><h2>Deine Spielabende</h2><span class="subtle">${sessionEntries().length} Abende · ${autoSessionEntries().length} automatisch</span></div>${list(sessionEntries())}</section></div>`;}
function updateManualDateInfo(){
 const d=document.getElementById('date'),hint=document.getElementById('manualDateInfo');if(!d||!hint)return;
 const n=gameEntries().filter(g=>g.date===d.value).length;
 hint.classList.toggle('hidden',!n);
 if(n)hint.textContent=`An diesem Datum gibt es bereits ${n} getrackte ${n===1?'Spiel':'Spiele'}. Der manuelle Betrag wird für diesen Abend anstelle der automatisch berechneten Summe angezeigt.`;
}
const FAST_TYPES=['rufspiel','solo','wenz','geier','farbwenz','farbgeier','bettel','ramsch'];
const AUTO_TYPES=['rufspiel','solo','wenz','geier','farbwenz','farbgeier','bettel','ramsch','hochzeit','kreuzrunde','bockrunde','hirsch','tout','sie'];
const SOLO_TYPES=['solo','wenz','geier','farbwenz','farbgeier','bettel','tout','sie'];
function typeButtons(ids){return ids.map(id=>`<button type="button" class="game-select game-art ${quickType===id?'chosen':''}" data-game-type="${id}" aria-pressed="${quickType===id}"><span class="gico">${richGameIcon(id)}</span><span>${gameLabel(id)}</span></button>`).join('');}
const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.floor(Number(v)||0)));
function maxRunners(type){
 if(type==='wenz'||type==='geier')return 4;
 if(type==='solo'||type==='farbwenz'||type==='farbgeier'||type==='tout'||type==='sie')return 8;
 if(type==='rufspiel'||type==='hochzeit'||type==='kreuzrunde'||type==='bockrunde'||type==='hirsch')return 14;
 return 0;
}
function minRunners(type){return type==='rufspiel'?Number(state.rules.rufMinRunners)===4?4:3:3;}
function getRates(){return {...defaultRates(),...(state.rates||{})};}
function baseFor(type){
 const r=getRates();
 if(['rufspiel','bockrunde','hirsch'].includes(type))return r.rufspiel/100;
 if(type==='ramsch')return r.ramsch/100;
 if(type==='hochzeit')return r.hochzeit/100;
 if(type==='kreuzrunde')return r.kreuzrunde/100;
 if(['solo','wenz','geier','farbwenz','farbgeier','tout'].includes(type))return r.solo/100;
 if(type==='bettel')return r.bettel/100;
 if(type==='sie')return r.solo/100; // Solotarif; (Solo + 8 Laeufer) wird erst danach vervierfacht
 return null;
}
function calcPricing(input){
 const type=input.type,base=baseFor(type);
 if(base===null)return {manual:true,price:0,amount:0,lines:[]};
 const knocks=clampInt(input.knocks,0,8);
 const bid=clampInt(input.bid,0,3);
 const runnersRaw=clampInt(input.runners,0,maxRunners(type));
 const runners=runnersRaw>=minRunners(type)?runnersRaw:0;
 const r=getRates();
 const schuss=state.rules.allowSchuss?clampInt(input.schuss,0,8):0;
 const jungfrau=type==='ramsch'?clampInt(input.jungfrau,0,3):0;
 const points=clampInt(input.points,0,120);
 const role=input.role==='defender'?'defender':type==='ramsch'&&input.role==='payer'?'payer':type==='ramsch'?'receiver':'declarer';
 const bock=type==='bockrunde'||!!input.bock;
 const cashSolo=SOLO_TYPES.includes(type);
 const pointGame=!['bettel','ramsch','tout','sie'].includes(type);
 let won=false,schneider=false,schwarz=false,loserPoints=null,usedRunners=0;
 if(pointGame){
  // Als Gegner reichen 60 Augen. Die Ansager-Partei muss mindestens 61 haben.
  won=role==='defender'?points>=60:points>=61;
  loserPoints=won?120-points:points;
  schneider=loserPoints<30;
  schwarz=loserPoints===0; // auch wenn ein punktloser Stich gemacht wurde
  usedRunners=runners;
 }else if(type==='bettel'){
  const tricks=clampInt(input.tricks,0,8);
  const declarerWon=tricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
 }else if(type==='ramsch'){
  won=role!=='payer';
 }else if(type==='tout'){
  // Tout gelingt nur bei 8 Ansagerstichen: kein Stich für die Gegenpartei.
  const opponentTricks=clampInt(input.tricks,0,8);
  const declarerWon=opponentTricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
  usedRunners=runners;
 }else if(type==='sie'){
  won=true; // Das angesagte Sie gewinnt definitionsgemäß.
  usedRunners=8;
 }
 // Geldbeträge konsequent in Cent berechnen.
 const baseCents=Math.round(base*100);
 const schneiderCents=schneider?r.schneider:0;
 const schwarzCents=schwarz?r.schwarz:0;
 const runnerCents=usedRunners*r.laeufer;
 const subtotalCents=baseCents+schneiderCents+schwarzCents+runnerCents;
 const specialMultiplier=type==='sie'?4:type==='tout'?2:1;
 const knockMultiplier=2**knocks;
 const schussMultiplier=2**schuss;
 const jungfrauMultiplier=2**jungfrau;
 const bidMultiplier=2**(type==='hirsch'?3:bid);
 const bockMultiplier=bock?2:1;
 const multiplier=specialMultiplier*knockMultiplier*schussMultiplier*jungfrauMultiplier*bidMultiplier*bockMultiplier;
 const priceCents=subtotalCents*multiplier;
 const roleFactor=type==='ramsch'?(won?1:3):type==='sie'?3:cashSolo?(role==='defender'?1:3):1;
 const amountCents=(won?1:-1)*priceCents*roleFactor;
 return {manual:false,won,schneider,schwarz,loserPoints,runner:usedRunners,runners:usedRunners,jungfrau,knocks,schuss,role,roleFactor,base,extras:schneiderCents/100,blackExtra:schwarzCents/100,runnerExtra:runnerCents/100,subtotal:subtotalCents/100,price:priceCents/100,amount:amountCents/100,multiplier,specialMultiplier,knockMultiplier,schussMultiplier,jungfrauMultiplier,bidMultiplier,bid:type==='hirsch'?3:bid,bock,bockMultiplier,points};
}
const gameDraft=()=>({points:61,knocks:0,schuss:0,runners:0,tricks:0,jungfrau:0,bock:false,bid:0,toutSubtype:'solo',role:'declarer',legacyManual:false,manualAmount:'0,50',manualSign:1,date:nowISO(),place:'',notes:''});
let draft=gameDraft(),specialOpen=false;
function draftFromEntry(e){const saved=e.scoreData||{};return {...gameDraft(),...saved,legacyManual:!e.scoreData,manualAmount:Math.abs(e.amount).toFixed(2).replace('.',','),manualSign:e.amount<0?-1:1,date:e.date,place:e.place||'',notes:e.notes||''};}
function ruleStepper(id,label,value,min,max,detail=''){return `<div class="rule-row"><div><b>${label}</b>${detail?`<div class="help">${detail}</div>`:''}</div><div class="stepper"><button type="button" data-step="${id}" data-change="-1" aria-label="${label} verringern" ${value<=min?'disabled':''}>−</button><span>${value}</span><button type="button" data-step="${id}" data-change="1" aria-label="${label} erhöhen" ${value>=max?'disabled':''}>+</button></div></div>`;}
function chooseRole(label1,label2,value1,value2){return `<div class="result-toggle small-toggle"><button type="button" data-role="${value1}" class="result-btn ${draft.role===value1?'selected win':''}">${label1}</button><button type="button" data-role="${value2}" class="result-btn ${draft.role===value2?'selected win':''}">${label2}</button></div>`;}
function priceDetails(result){
 if(result.manual)return `<div class="price-panel"><b>Eigener Spielpreis</b><div class="help">Für diese Sonderregel wurde noch kein Preis festgelegt.</div></div>`;
 const notes=[];
 notes.push(`<div><span>Grundpreis</span><b>${normalEUR(result.base)}</b></div>`);
 if(result.schneider)notes.push(`<div><span>Schneider (Verliererpartei unter 30)</span><b>+${normalEUR(result.extras)}</b></div>`);
 if(result.schwarz)notes.push(`<div><span>Schwarz (Verliererpartei 0 Punkte)</span><b>+${normalEUR(result.blackExtra)}</b></div>`);
 if(result.runner)notes.push(`<div><span>${result.runner} Läufer</span><b>+${normalEUR(result.runnerExtra)}</b></div>`);
 if(result.specialMultiplier>1)notes.push(`<div><span>${quickType==='tout'?'Tout':'Sie'}</span><b>× ${result.specialMultiplier}</b></div>`);
 if(result.knocks)notes.push(`<div><span>${result.knocks} Klopfer / Legen</span><b>× ${result.knockMultiplier}</b></div>`);
 if(result.schuss)notes.push(`<div><span>${result.schuss} Schuss</span><b>× ${result.schussMultiplier}</b></div>`);
 if(result.jungfrau)notes.push(`<div><span>${result.jungfrau} Jungfrau(en)</span><b>× ${result.jungfrauMultiplier}</b></div>`);
 if(result.bid)notes.push(`<div><span>${result.bid===1?'Kontra':result.bid===2?'Kontra + Re':'Kontra + Re + Hirsch'}</span><b>× ${result.bidMultiplier}</b></div>`);
 if(result.bock)notes.push(`<div><span>Bockrunde</span><b>× 2</b></div>`);
 if(result.roleFactor>1)notes.push(`<div><span>${draft.role==='payer'?'Zahler gegen 3':'Ansager gegen 3'}</span><b>× ${result.roleFactor}</b></div>`);
 return `<div class="price-panel"><div class="price-panel-heading"><b>${quickType==='sie'?'Preis pro Gegner':'Spielpreis'}</b><strong>${normalEUR(result.price)}</strong></div>${notes.join('')}<div class="price-final"><span>Deine Bilanz</span><strong class="${amountColor(result.amount)}">${euro(result.amount)}</strong></div><p class="help">${result.won?'Gewonnen':'Verloren'} · Zuschläge werden vor der Verdopplung addiert.</p></div>`;
}
function gameCalculation(){if(draft.legacyManual)return {manual:true,price:0,amount:0};return calcPricing({type:quickType,...draft});}
function gamePriceContent(){
 const g=gameCalculation(),isManual=g.manual;
 const pointType=!isManual&&!['ramsch','bettel','tout','sie'].includes(quickType);
 const roleNormal=pointType||['bettel','tout','sie'].includes(quickType);
 const resultLabel=(g.won?'Gewonnen':'Verloren')+(g.schneider?' · Schneider':'')+(g.schwarz?' · Schwarz':'');
 return `<div class="game-entry-area"><div class="step-label">2 · Spiel auswerten</div>
 ${pointType?`<label class="field compact-field">Erreichte Punkte (deine Partei, 0–120)<input type="number" inputmode="numeric" id="gamePoints" min="0" max="120" step="1" value="${draft.points}" required></label><div class="score-meter"><div style="width:${draft.points/120*100}%"></div></div><div class="outcome ${g.won?'success':'fail'}">${draft.points} / 120 Punkte · ${resultLabel}</div><p class="help">Schneider: 0–29 Punkte der Verliererpartei; Schwarz: 0 Punkte – beide Zuschläge zusammen.</p>${maxRunners(quickType)?ruleStepper('runners','Läufer',Math.min(draft.runners,maxRunners(quickType)),0,maxRunners(quickType),`0 oder ${minRunners(quickType)}–${maxRunners(quickType)} Läufer. Bei dieser Spielart maximal ${maxRunners(quickType)}.`):''}`:''}
 ${quickType==='bettel'?`<label class="field compact-field">Stiche des Ansagers (0–8)<input type="number" id="gameTricks" min="0" max="8" step="1" inputmode="numeric" value="${draft.tricks}"></label><div class="outcome ${g.won?'success':'fail'}">${draft.tricks===0?'Ansager ohne Stich – erfolgreich':'Ansager hat Stich(e) – verloren'} · ${g.won?'Gewonnen':'Verloren'}</div>`:''}

function trumpSort(a,b){

}
function games(){return `<div class="games-sections"><div class="counter-tab-bar" role="tablist" aria-label="Spiele – Bereich wählen"><button type="button" role="tab" data-games-subtab="entry" aria-selected="${gamesSubtab==='entry'}" class="${gamesSubtab==='entry'?'active':''}">♠ Einzelspiel</button><button type="button" role="tab" data-games-subtab="counter" aria-selected="${gamesSubtab==='counter'}" class="${gamesSubtab==='counter'?'active':''}">▦ Karten zählen</button></div>${gamesSubtab==='counter'?`<div class="training-modes"><button type="button" data-training-view="simple" class="${trainingView==='simple'?'active':''}">Einfach zählen</button><button type="button" data-training-view="stitch" class="${trainingView==='stitch'?'active':''}">Mit Stichverlauf</button></div>${trainingView==='stitch'?stitchUI():counterUI()}`:singleGameUI()}</div>`;}
function handleCounterClick(t){
 if(handleStitchClick(t))return true;
 const sub=t.closest('[data-games-subtab]');if(sub){if(gamesSubtab==='entry')readDraftFromDom();gamesSubtab=sub.dataset.gamesSubtab;editId=null;render();window.scrollTo(0,0);return true;}
 if(trainingView==='stitch')return false;
 const card=t.closest('[data-counter-card]');if(card){const id=card.dataset.counterCard;if(!CARD_MAP[id])return true;const existed=counter.fallen.includes(id);counter.fallen=existed?counter.fallen.filter(c=>c!==id):[...counter.fallen,id];counter.actions.push({id,added:!existed});if(counter.actions.length>100)counter.actions.shift();saveCounter();refreshCounter();return true;}
 if(t.closest('#counterUndo')){const action=counter.actions.pop();if(action){counter.fallen=action.added?counter.fallen.filter(c=>c!==action.id):[...counter.fallen,action.id];saveCounter();refreshCounter();}return true;}
 if(t.closest('#counterReset')){if(!confirm('Neue Zählrunde starten? Alle aktuell markierten Karten werden zurückgesetzt.'))return true;const opts={type:counter.type,trumpSuit:counter.trumpSuit,sort:counter.sort,showEyes:counter.showEyes};counter={...counterDefaults(),...opts};saveCounter();refreshCounter();flash('Neue Zählrunde gestartet');return true;}
 const sort=t.closest('[data-counter-sort]');if(sort){counter.sort=sort.dataset.counterSort;saveCounter();refreshCounter();return true;}
 if(t.closest('#counterEyes')){counter.showEyes=!counter.showEyes;saveCounter();refreshCounter();return true;}
 return false;
}
function refreshCounter(){if(tab!=='games'||gamesSubtab!=='counter')return;const wrap=document.querySelector('.counter-layout');if(wrap)wrap.outerHTML=counterUI();}
document.addEventListener('click',ev=>{if(handleCounterClick(ev.target)){ev.preventDefault();ev.stopPropagation();}},true);
document.addEventListener('change',ev=>{if(stitchChange(ev.target))return;if(ev.target.id==='counterType'){counter.type=ev.target.value;saveCounter();refreshCounter();}else if(ev.target.id==='counterSuit'){counter.trumpSuit=ev.target.value;saveCounter();refreshCounter();}},true);

function render(){const titles={home:'Servus '+(state.name?state.name+'!':'am Kartentisch!'),history:'Deine Spielabende',games:gamesSubtab==='counter'?'Karten zählen':'Deine Einzelspiele',stats:'Deine Statistik',profile:'Dein Profil'},subs={home:'Abende und Spiele – übersichtlich getrennt.',history:'Eintragen, ansehen, bearbeiten.',games:gamesSubtab==='counter'?'Alle 32 Karten auf einen Blick.':'Punkte eingeben – Zuschläge automatisch!',stats:'Deine Abende und Spielarten im Überblick.',profile:'Deine Einstellungen und Datensicherung.'};document.getElementById('app').classList.toggle('is-subpage',tab!=='home');document.getElementById('app').classList.toggle('is-game',tab==='games');document.getElementById('brandSuit').innerHTML='<img src="icon.png" alt="Schafkopftracker Logo">';document.getElementById('suits').innerHTML=['bell','acorn','leaf','heart'].map(s=>`<span class="suit">${suit(s)}</span>`).join('');document.getElementById('headerTitle').textContent=titles[tab];document.getElementById('headerSub').textContent=subs[tab];document.getElementById('main').innerHTML=({home,history,games,stats,profile})[tab]();document.getElementById('nav').innerHTML=[['home','Übersicht','home'],['history','Abende','history'],['games','Spiele','plus'],['stats','Statistik','stats'],['profile','Profil','user']].map(([id,label,ico])=>`<button data-tab="${id}" class="${id===tab?'active':''}" ${id===tab?'aria-current="page"':''}>${symbol(ico)}${label}</button>`).join('');if(tab==='profile'&&importCandidate)importPreview();if(tab==='history')updateManualDateInfo();}
function beginEdit(id){const e=state.entries.find(x=>x.id===id);if(!e)return;editId=id;tab=e.kind==='game'?'games':'history';if(e.kind==='game'){gamesSubtab='entry';quickType=e.gameType;draft=draftFromEntry(e);if(quickType==='hirsch')draft.bid=3;if(quickType==='bockrunde')draft.bock=true;moreTypes=!FAST_TYPES.includes(quickType);}render();document.querySelector('.formcard').scrollIntoView({behavior:'smooth',block:'start'});}
function importNormalize(data){const payload=data&&typeof data==='object'?(data.profile||data):null;if(!payload||!Array.isArray(payload.entries)||payload.entries.length>20000)throw Error('Keine gültige Schafkopf-Sicherung.');const entries=payload.entries.map((e,i)=>{if(!e||typeof e.date!=='string'||!validDate(e.date)||!Number.isFinite(Number(e.amount))||Math.abs(Number(e.amount))>10000000)throw Error('Ungültiger Eintrag '+(i+1));return normEntry(e,i);});return {...defaultState(),name:String(payload.name||'').slice(0,40),public:!!payload.public,goalTarget:Number(payload.goalTarget)>0?Number(payload.goalTarget):0,showGoal:!!payload.showGoal,rates:{...defaultRates(),...(payload.rates&&typeof payload.rates==='object'?payload.rates:{})},rules:{...defaultRules(),...(payload.rules&&typeof payload.rules==='object'?payload.rules:{})},entries};}
function importPreview(){if(!importCandidate)return;const el=document.getElementById('importPreview');if(!el)return;const d=importCandidate.data,duplicates=d.entries.filter(x=>state.entries.some(e=>fp(e)===fp(x))).length;el.innerHTML=`<div class="import-preview"><b>Backup-Vorschau</b><p class="help">${esc(importCandidate.filename)}<br>${d.entries.filter(e=>e.kind==='session').length} Abende · ${d.entries.filter(e=>e.kind==='game').length} Spiele<br>${duplicates} bereits vorhandene Einträge${importCandidate.training?.stitch?`<br>${Array.isArray(importCandidate.training.stitch.archive)?importCandidate.training.stitch.archive.length:0} Trainingsverläufe in Sicherung`:''}</p><div class="form-actions"><button type="button" class="btn secondary" id="mergeImport">Nur neue ergänzen</button><button type="button" class="btn danger" id="replaceImport">Alles ersetzen</button><button type="button" class="btn ghost" id="cancelImport">Abbrechen</button></div></div>`;}
function applyImport(mode){if(!importCandidate)return;if(mode==='replace'&&!confirm('Alle bisherigen Daten durch dieses Backup ersetzen?'))return;const d=importCandidate.data;if(mode==='replace'){state=d;}else{const fs=new Set(state.entries.map(fp)),ids=new Set(state.entries.map(e=>e.id));for(const e of d.entries){if(fs.has(fp(e)))continue;const item={...e,id:ids.has(e.id)?uid():e.id};ids.add(item.id);fs.add(fp(item));state.entries.push(item);}}if(!save())return;const incoming=importCandidate.training;if(incoming&&incoming.stitch){const restored=stitchNormalize(incoming.stitch);if(mode==='replace')stitch=restored;else{const known=new Set(stitch.archive.map(a=>a.id));for(const a of restored.archive){if(!known.has(a.id)){stitch.archive.push(a);known.add(a.id);}}}saveStitch();}if(incoming&&incoming.counter&&mode==='replace'){const ci=incoming.counter;counter={...counterDefaults(),...ci,fallen:Array.isArray(ci.fallen)?ci.fallen.filter(id=>!!CARD_MAP[id]):[],actions:[]};saveCounter();}importCandidate=null;editId=null;render();flash('Import erfolgreich');}
function exportBackup(){const exported=new Date().toISOString(),payload={version:4,appVersion:VERSION,exported,profile:state,training:{counter,stitch}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`schafkopf-backup-${nowISO()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);state.lastBackupAt=exported;state.lastBackupCount=state.entries.length;save();render();}
function refreshGameChoice(){document.querySelectorAll('[data-game-type]').forEach(b=>{const yes=b.dataset.gameType===quickType;b.classList.toggle('chosen',yes);b.setAttribute('aria-pressed',String(yes));});}
function storeEntry(kind){const isGame=kind==='game',error=document.getElementById(isGame?'gameError':'entryError');if(error)error.textContent='';let val;
 if(isGame){readDraftFromDom();if(!validDate(draft.date)){error.textContent='Bitte ein gültiges Datum auswählen.';return;}
  if(quickType!=='bettel'&&quickType!=='ramsch'&&baseFor(quickType)!==null&&(!Number.isInteger(Number(draft.points))||Number(draft.points)<0||Number(draft.points)>120)){error.textContent='Punkte müssen zwischen 0 und 120 liegen.';return;}
  if(draft.runners>maxRunners(quickType)||(draft.runners>0&&draft.runners<minRunners(quickType))){error.textContent=`Bei ${gameLabel(quickType)} sind nur 0 oder ${minRunners(quickType)}–${maxRunners(quickType)} Läufer zulässig.`;return;}
  const calc=gameCalculation();let amount=calc.amount;
  if(calc.manual){const manual=parseAmount(draft.manualAmount);if(!Number.isFinite(manual)||manual>100000){error.textContent='Bitte einen gültigen Betrag eintragen.';return;}amount=Math.round(manual*draft.manualSign*100)/100;}
  const scoreData=calc.manual?null:{type:quickType,points:draft.points,tricks:draft.tricks,knocks:draft.knocks,schuss:calc.schuss,runners:calc.runners,schwarz:calc.schwarz,schneider:calc.schneider,loserPoints:calc.loserPoints,jungfrau:draft.jungfrau,role:draft.role,price:calc.price,roleFactor:calc.roleFactor,bock:calc.bock,bid:calc.bid,rates:{...getRates()}};
  val={date:draft.date,amount,kind:'game',gameType:quickType,place:draft.place.trim().slice(0,80),notes:draft.notes.trim().slice(0,160),scoreData};
 }else{const amount=parseAmount(document.getElementById('amount').value),date=document.getElementById('date').value,sign=Number(document.getElementById('resultType').value);if(!Number.isFinite(amount)||amount>10000000){error.textContent='Bitte einen gültigen Betrag eingeben.';return;}if(!validDate(date)){error.textContent='Bitte ein gültiges Datum auswählen.';return;}
  if(gameEntries().some(g=>g.date===date)&&!confirm('Für diesen Tag sind bereits Einzelspiele erfasst. Ein manueller Abend ersetzt in der Abendbilanz die automatisch berechnete Summe für dieses Datum. Möchtest du trotzdem manuell speichern?'))return;
  val={date,amount:Math.round(amount*sign*100)/100,kind:'session',gameType:'',place:document.getElementById('place').value.trim().slice(0,80),notes:document.getElementById('notes').value.trim().slice(0,160),scoreData:null};}
 const previous=editId?state.entries.find(e=>e.id===editId):null;if(editId&&!previous){error.textContent='Eintrag nicht gefunden.';return;}if(previous)Object.assign(previous,val);else state.entries.push({...val,id:uid()});if(!save())return;if(isGame&&!previous&&pendingStitchArchive){const a=stitch.archive.find(x=>x.id===pendingStitchArchive);if(a){a.linkedGameId=state.entries.at(-1).id;saveStitch();}pendingStitchArchive=null;}const wasEdit=!!editId;editId=null;if(isGame){draft=gameDraft();if(quickType==='hirsch')draft.bid=3;if(quickType==='bockrunde')draft.bock=true;if(quickType==='ramsch')draft.role='receiver';}render();flash(wasEdit?'Änderung gespeichert':isGame?'Spiel gespeichert ✓':'Abend gespeichert ✓');}
function offerUpdate(worker){pendingUpdate=worker;document.getElementById('updateBanner').classList.remove('hidden');}
let pendingUpdate=null;
document.addEventListener('click',async ev=>{const t=ev.target;const tabButton=t.closest('[data-tab]');if(tabButton){switchTab(tabButton.dataset.tab);return;}const type=t.closest('[data-game-type]');if(type){readDraftFromDom();const oldType=quickType;quickType=type.dataset.gameType;draft.legacyManual=false;draft.runners=Math.min(draft.runners,maxRunners(quickType));if(draft.runners<minRunners(quickType))draft.runners=0;
 if(oldType==='hirsch'&&quickType!=='hirsch')draft.bid=0;
 if(quickType==='hirsch')draft.bid=3;
 if(oldType==='bockrunde'&&quickType!=='bockrunde')draft.bock=false;
 if(quickType==='bockrunde')draft.bock=true;if(quickType==='ramsch'&&draft.role!=='payer'&&draft.role!=='receiver')draft.role='receiver';else if(quickType!=='ramsch'&&!['declarer','defender'].includes(draft.role))draft.role='declarer';refreshGameChoice();refreshCalculation();return;}
 const step=t.closest('[data-step]');if(step){readDraftFromDom();const field=step.dataset.step,delta=Number(step.dataset.change),max=field==='runners'?maxRunners(quickType):field==='jungfrau'?3:8;let next=clampInt(draft[field]+delta,0,max);if(field==='runners'){const min=minRunners(quickType);if(delta>0&&next>0&&next<min)next=min;if(delta<0&&next<min)next=0;}draft[field]=next;refreshCalculation();return;}
 const role=t.closest('[data-role]');if(role){readDraftFromDom();draft.role=role.dataset.role;refreshCalculation();return;}
 const mSign=t.closest('[data-manual-sign]');if(mSign){readDraftFromDom();draft.manualSign=Number(mSign.dataset.manualSign);refreshCalculation();return;}
 const sSign=t.closest('[data-session-sign]');if(sSign){document.getElementById('resultType').value=sSign.dataset.sessionSign;document.querySelectorAll('[data-session-sign]').forEach(b=>b.classList.toggle('selected',b===sSign));return;}if(t.closest('#toggleExtra')){readDraftFromDom();moreTypes=!moreTypes;render();return;}
 if(t.closest('#toggleAllGames')){showAllGames=!showAllGames;render();return;}const e=t.closest('[data-edit]');if(e){beginEdit(e.dataset.edit);return;}const del=t.closest('[data-delete]');if(del){const item=state.entries.find(e=>e.id===del.dataset.delete);if(item&&confirm(`${item.kind==='game'?'Dieses Einzelspiel':'Diesen Abend'} wirklich löschen?`)){state.entries=state.entries.filter(e=>e.id!==item.id);if(editId===item.id)editId=null;if(save())render();}return;}if(t.closest('#cancelEdit')){editId=null;draft=gameDraft();render();return;}if(t.closest('#toggleSchuss')){state.rules.allowSchuss=!state.rules.allowSchuss;if(save())render();return;}
 if(t.closest('#toggleKontra')){state.rules.allowKontra=!state.rules.allowKontra;if(save())render();return;}
 if(t.closest('#resetRates')){if(confirm('Alle Spieltarife auf die Standardwerte zurücksetzen?')){state.rates=defaultRates();state.rules.rufMinRunners=3;if(save())render();}return;}
 if(t.closest('#toggleGoal')){state.showGoal=!state.showGoal;if(save())render();return;}if(t.closest('#clearGoal')){state.goalTarget=0;if(save())render();return;}if(t.closest('#saveName')){state.name=document.getElementById('profileName').value.trim().slice(0,40);if(save())render();return;}if(t.closest('#export')){exportBackup();return;}if(t.closest('#cancelImport')){importCandidate=null;document.getElementById('importPreview').innerHTML='';return;}if(t.closest('#mergeImport')){applyImport('merge');return;}if(t.closest('#replaceImport')){applyImport('replace');return;}if(t.closest('#applyUpdate')){if(pendingUpdate)pendingUpdate.postMessage({type:'SKIP_WAITING'});return;}if(t.closest('#dismissUpdate')){document.getElementById('updateBanner').classList.add('hidden');return;}if(t.closest('#checkUpdate')){const out=document.getElementById('updateStatus');if(!navigator.onLine){out.textContent='Du bist offline.';return;}if(!('serviceWorker' in navigator)){out.textContent='Dieser Browser unterstützt keine Update-Prüfung.';return;}out.textContent='Suche nach Updates…';try{const reg=await navigator.serviceWorker.ready;await reg.update();out.textContent=reg.waiting?'Update bereit.':'Auf dem neuesten Stand oder Update wird vorbereitet.';if(reg.waiting)offerUpdate(reg.waiting);}catch{out.textContent='Prüfung fehlgeschlagen.';}return;}const chartRangeBtn=t.closest('[data-chart-range]');if(chartRangeBtn){chartRange=chartRangeBtn.dataset.chartRange;chartSelected=null;document.getElementById('chartContainer').innerHTML=chart();return;}const point=t.closest('[data-point]');if(point){chartSelected=Number(point.dataset.point);document.getElementById('chartContainer').innerHTML=chart();return;}});
document.addEventListener('keydown',e=>{const p=e.target.closest('[data-point]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chartSelected=Number(p.dataset.point);document.getElementById('chartContainer').innerHTML=chart();}});
document.addEventListener('submit',e=>{if(e.target.id==='sessionForm'||e.target.id==='gameForm'){e.preventDefault();storeEntry(e.target.id==='gameForm'?'game':'session');}else if(e.target.id==='ratesForm'){e.preventDefault();const form=new FormData(e.target);const next={};for(const id of Object.keys(defaultRates())){const raw=String(form.get(id)||'');const val=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(val)||val<0||val>10000){document.getElementById('ratesMessage').textContent='Bitte gültige ganze Cent-Beträge zwischen 0 und 10.000 eintragen.';return;}next[id]=val;}state.rates=next;state.rules.rufMinRunners=Number(form.get('rufMinRunners'))===4?4:3;if(save()){render();flash('Tarife gespeichert ✓');}return;}else if(e.target.id==='goalForm'){e.preventDefault();const g=parseAmount(document.getElementById('goalAmount').value);if(!Number.isFinite(g)||g<=0){alert('Bitte einen positiven Zielbetrag eingeben.');return;}state.goalTarget=g;if(save())render();}});
document.addEventListener('input',e=>{if(e.target.id==='gameManualAmount'){draft.manualAmount=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='date'){updateManualDateInfo();return;}if(['gamePoints','gameRamschPoints','gameTricks','gameBock','gameBid'].includes(e.target.id)){readDraftFromDom();refreshCalculation();}});
document.addEventListener('change',async e=>{if(e.target.id==='chartScrub'){chartSelected=Number(e.target.value);document.getElementById('chartContainer').innerHTML=chart();}else if(e.target.id==='statYear'){selectedYear=Number(e.target.value);render();}else if(e.target.id==='import'){const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024){alert('Backup darf maximal 10 MB groß sein.');return;}try{const raw=JSON.parse(await file.text());importCandidate={filename:file.name,data:importNormalize(raw),training:raw&&raw.training&&typeof raw.training==='object'?raw.training:null};importPreview();}catch(err){alert('Import nicht möglich: '+err.message);}e.target.value='';}});
if('serviceWorker' in navigator){let controlled=!!navigator.serviceWorker.controller,reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled&&!reloaded){reloaded=true;location.reload();}controlled=true;});window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}),watch=w=>{if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(w);});};if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);watch(reg.installing);reg.addEventListener('updatefound',()=>watch(reg.installing));if(navigator.onLine)reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine)reg.update().catch(()=>{});});}catch(err){console.warn('Service Worker nicht verfügbar',err);}});}
