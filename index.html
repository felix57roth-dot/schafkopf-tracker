/* v1.2: Mobile Ansicht – lange Rundennamen dürfen nicht die Seitenbreite verändern. */
html,body{max-width:100%;overflow-x:clip}
.app,.main,.hero,.dashboardgrid,.section,.card,.list{min-width:0}
.app{width:100%}
.list{grid-template-columns:minmax(0,1fr)}
.entryinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amount{white-space:nowrap}
.balancebar>div{min-width:0}
.balance strong{overflow-wrap:anywhere}
.kpi b{overflow-wrap:anywhere}
@media(max-width:650px){
 .entry{display:grid;grid-template-columns:56px minmax(0,1fr) 34px;grid-template-rows:auto auto;grid-template-areas:"date info remove" "date amount remove";column-gap:12px;row-gap:3px;padding:12px;align-items:center;width:100%}
 .entry .datebadge{grid-area:date;min-width:0;width:56px;align-self:center}
 .entry .entryinfo{grid-area:info;min-width:0;max-width:100%;width:100%}
 .entry .amount{grid-area:amount;justify-self:start;font-size:14px}
 .entry .mini-btn{grid-area:remove;min-width:34px;height:36px;justify-self:end}
}
@media(max-width:480px){
 .brand{font-size:clamp(13px,3.8vw,17px);gap:7px;white-space:nowrap}
 .emblem{width:38px;height:38px;flex:0 0 38px}
 .suite{gap:0;flex-shrink:0}
 .suite .suit{width:clamp(16px,5vw,25px);height:26px}

@media(max-width:350px){.balancebar{flex-wrap:wrap}.balancebar .btn{width:100%}}

/* v1.5: Nur die Dashboard-Bilanz liegt auf dem grünen Kopfbereich. */
.app.is-subpage .hero{padding-bottom:30px}
.app.is-subpage .main{margin-top:0}

/* Die Jahresauswahl muss sich auf schmalen Smartphones umbrechen koennen. */
.stats-heading{flex-wrap:wrap;align-items:center;gap:12px}
.stats-heading h2{flex:1 1 210px;min-width:0;line-height:1.2;overflow-wrap:normal}

@media(max-width:360px){.stats-heading h2{flex-basis:100%}.stats-heading .year-picker{margin-left:0}}

.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-option input{position:absolute;opacity:0;pointer-events:none}
.mode-option{position:relative}
.mode-card{display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid #d7e3d8;background:#f6f8f5;color:#315447;border-radius:14px;font-weight:800;cursor:pointer;text-align:center}
.mode-option input:checked + .mode-card{background:#0d7454;color:#fff;border-color:#0d7454}
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game-option input{position:absolute;opacity:0;pointer-events:none}
.game-option{position:relative}
.game-card{border:1px solid #d7e3d8;border-radius:16px;background:linear-gradient(180deg,#fafbfa,#f1f4f0);padding:11px 8px;display:grid;gap:8px;min-height:110px;align-items:center;justify-items:center;text-align:center;box-shadow:0 4px 12px rgba(11,46,33,.04);cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow}
.game-card .gico{width:50px;height:38px;color:#203a31;display:grid;place-items:center}
.game-card .gico svg{width:100%;height:100%}
.game-card .glabel{font-size:12px;font-weight:800;line-height:1.15}
.game-option input:checked + .game-card{border-color:#c39a43;box-shadow:0 8px 20px rgba(195,154,67,.20);background:linear-gradient(180deg,#fffdf7,#f8f0dd);transform:translateY(-1px)}
.game-option input:focus-visible + .game-card{outline:3px solid #c39a43;outline-offset:2px}
.form-hint{font-size:12px;color:var(--muted);margin-top:-4px}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.small-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 9px;background:#edf5ee;color:#315447;font-size:11px;font-weight:800;line-height:1}

.game-type-list{display:grid;gap:10px}
.game-type-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,.8fr));gap:10px;align-items:center;padding:13px 14px}

.game-type-cell{min-width:0;font-size:13px}
.game-type-main{display:flex;align-items:center;gap:10px;min-width:0}
.game-type-main .gico{width:38px;height:30px;flex:0 0 38px}
.game-type-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-type-main small{display:block;color:var(--muted);font-size:11px}

@media(max-width:760px){.game-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game-type-row{grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));grid-template-areas:"main count total" "main wl avg";row-gap:6px}.game-type-row .main{grid-area:main}.game-type-row .count{grid-area:count}.game-type-row .total{grid-area:total}.game-type-row .wl{grid-area:wl}.game-type-row .avg{grid-area:avg}.game-type-row .rate{display:none}.game-type-head{display:none}}

/* v1.7 – schnell bedienbare, klar getrennte Ansicht */
.hero{padding-bottom:65px}
.app.is-subpage .hero{padding-bottom:26px}
.game-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:18px;box-shadow:var(--shadow)}

.game-fast-panel{padding:18px 15px}
.game-fast-panel .sectionhead{margin-bottom:16px}
.fast-game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.game-select{min-width:0;border:1.5px solid #d9e3d9;border-radius:12px;background:linear-gradient(180deg,#fbfcfa,#eff4ed);color:#213d32;padding:9px 3px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-height:78px;font-size:11px;line-height:1.2;font-weight:800;text-align:center}

function normalizeEntry(e){const today=new Date();const fallbackDate=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');const fallbackId='id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);return {
  id:String(e.id||fallbackId).slice(0,90),
  date:String(e.date||fallbackDate),
  amount:Math.round(Number(e.amount||0)*100)/100,
  place:String(e.place||'').slice(0,80),
  notes:String(e.notes||'').slice(0,160),
  kind:e.kind==='game'?'game':'session',
  gameType:GAME_MAP[e.gameType]?e.gameType:''
 };}

const VERSION='3.5';
const KEY='schafkopf-tracker-v1'; // unveraendert seit v1.1
const defaultRates=()=>({rufspiel:10,solo:50,bettel:50,hochzeit:20,kreuzrunde:20,ramsch:10,schneider:10,schwarz:10,laeufer:10});
const defaultRules=()=>({allowSchuss:false,allowKontra:false,rufMinRunners:3});
const defaultState=()=>({name:'',public:false,entries:[],goalTarget:0,showGoal:false,lastBackupAt:'',lastBackupCount:0,rates:defaultRates(),rules:defaultRules()});
let state=defaultState();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'&&!Array.isArray(saved))state={...defaultState(),...saved};}catch(err){console.warn('Lokale Daten konnten nicht gelesen werden.',err);}
if(!Array.isArray(state.entries))state.entries=[];
state.rates={...defaultRates(),...(state.rates&&typeof state.rates==='object'?state.rates:{})};
state.rules={...defaultRules(),...(state.rules&&typeof state.rules==='object'?state.rules:{})};
const fmtEUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const euro=n=>(n>0?'+':'')+fmtEUR.format(n);
const normalEUR=n=>fmtEUR.format(n);
const amountColor=n=>n>0?'positive':n<0?'negative':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
const thisYear=()=>new Date().getFullYear();
const validDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return Number.isFinite(d.getTime())&&[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===s;};
const parseAmount=s=>{const v=String(s??'').trim().replace(',','.');return /^\d+(?:\.\d{1,2})?$/.test(v)?Math.round(Number(v)*100)/100:NaN;};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const normEntry=(e,i)=>({id:String(e.id||('import-'+i+'-'+uid())).slice(0,90),date:e.date,amount:Math.round(Number(e.amount)*100)/100,place:String(e.place||'').slice(0,80),notes:String(e.notes||'').slice(0,160),kind:e.kind==='game'?'game':'session',gameType:e.kind==='game'&&GAME_MAP[e.gameType]?e.gameType:'',scoreData:e.kind==='game'&&e.scoreData&&typeof e.scoreData==='object'?{...e.scoreData}:null});
state.entries=state.entries.filter(e=>e&&typeof e.date==='string'&&validDate(e.date)&&Number.isFinite(Number(e.amount))).map(normEntry);
/* Alle gespeicherten Abende bleiben manuell. Automatische Abendzeilen werden
   aus Einzelspielen on demand berechnet und NICHT im LocalStorage dupliziert. */
const manualSessionEntries=()=>state.entries.filter(e=>e.kind!=='game');
const gameEntries=()=>state.entries.filter(e=>e.kind==='game');
function autoSessionEntries(){
 const manualDates=new Set(manualSessionEntries().map(e=>e.date));
 const byDay=new Map();
 for(const game of gameEntries()){
  if(manualDates.has(game.date))continue; // manuelle Tagesbilanz hat Vorrang; keine doppelte Wertung
  if(!byDay.has(game.date))byDay.set(game.date,{date:game.date,amountCents:0,count:0});
  const day=byDay.get(game.date);
  day.amountCents+=Math.round(Number(game.amount)*100);
  day.count++;
 }
 return Array.from(byDay.values()).map(day=>({
  id:'automatic-day-'+day.date,date:day.date,kind:'session',auto:true,
  gameCount:day.count,amount:day.amountCents/100,
  place:'Aus Einzelspielen',notes:'',gameType:'',scoreData:null
 }));
}
const sessionEntries=()=>[...manualSessionEntries(),...autoSessionEntries()];
const sortDate=(a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id));
const sorted=(entries)=>[...entries].sort(sortDate);
const total=(arr)=>Math.round(arr.reduce((s,e)=>s+Number(e.amount),0)*100)/100;
const summary=(arr)=>({count:arr.length,amount:total(arr),won:arr.filter(e=>e.amount>0).length,lost:arr.filter(e=>e.amount<0).length});
const labelDate=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const mon=m=>new Date(2024,m,1).toLocaleDateString('de-DE',{month:'short'});
const fp=e=>JSON.stringify([e.date,Number(e.amount),e.place||'',e.notes||'',e.kind||'session',e.gameType||'',e.scoreData?JSON.stringify(e.scoreData):'']);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(err){alert('Speichern fehlgeschlagen. Bitte den freien Gerätespeicher prüfen.');return false;}}
let tab='home',editId=null,chartRange='all',chartSelected=null,selectedYear=thisYear(),importCandidate=null;

function flash(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2300);}
function switchTab(next){if(next!=='games')pendingStitchArchive=null;mentorMode=next==='mentor';tab=next;editId=null;chartSelected=null;render();scrollTo({top:0,behavior:'instant'});}
function periodEntries(year){return sorted(sessionEntries()).filter(e=>e.date.startsWith(String(year)+'-'));}
function years(){return [...new Set([...sessionEntries().map(e=>Number(e.date.slice(0,4))),thisYear()])].filter(Number.isFinite).sort((a,b)=>b-a);}
function months(year){return Array.from({length:12},(_,m)=>{const arr=periodEntries(year).filter(e=>Number(e.date.slice(5,7))===m+1);return {m,count:arr.length,amount:total(arr)};});}
function runStats(){const arr=sorted(sessionEntries());let win=0,loss=0,bestWin=0,bestLoss=0;for(const e of arr){win=e.amount>0?win+1:0;loss=e.amount<0?loss+1:0;bestWin=Math.max(win,bestWin);bestLoss=Math.max(loss,bestLoss);}return {bestWin,bestLoss,best:arr.filter(e=>e.amount>0).sort((a,b)=>b.amount-a.amount)[0],worst:arr.filter(e=>e.amount<0).sort((a,b)=>a.amount-b.amount)[0]};}
function gameStats(){const games=gameEntries();return [...GAME_TYPES,...RETIRED_GAME_TYPES].map(g=>{const arr=games.filter(e=>e.gameType===g.id),s=summary(arr);return {...s,id:g.id,label:g.label,avg:s.count?s.amount/s.count:0,rate:(s.won+s.lost)?s.won/(s.won+s.lost)*100:0};}).filter(x=>x.count).sort((a,b)=>b.count-a.count||b.amount-a.amount);}
function card(label,value,details='',cls=''){return `<div class="card stat-card"><div class="small">${label}</div><b class="${cls}">${value}</b>${details?`<p class="help">${details}</p>`:''}</div>`;}
function goalUI(){const goal=Number(state.goalTarget)||0,bal=total(periodEntries(thisYear())),pct=goal?Math.max(0,Math.min(100,bal/goal*100)):0;return `<div class="goal-header"><div><div class="small">Jahresziel ${thisYear()}</div><b class="goal-current ${amountColor(bal)}">${euro(bal)}</b></div><span class="goal-target">${goal?`Ziel ${normalEUR(goal)}`:'Noch kein Ziel gesetzt'}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div style="width:${pct}%"></div></div><div class="help">${goal?(bal>=goal?'Ziel erreicht!':`${Math.round(pct)} % erreicht`):'Trage unten dein freiwilliges Ziel ein.'}</div>`;}
function bestOf(){const gs=gameStats();return {most:gs[0],best:gs.slice().sort((a,b)=>b.amount-a.amount)[0],bestAvg:gs.filter(g=>g.count>=3).sort((a,b)=>b.avg-a.avg)[0]};}
function chartPoints(){const items=sorted(sessionEntries()),period=nowISO().slice(0,7);let acc=0;const all=items.map(e=>({...e,cumulative:(acc=Math.round((acc+e.amount)*100)/100)}));const shown=chartRange==='last10'?all.slice(-10):chartRange==='month'?all.filter(e=>e.date.startsWith(period)):all;const start=shown.length?Math.round((shown[0].cumulative-shown[0].amount)*100)/100:0;return {shown,start};}
function axisTicks(a,b){const low=a===b?a-1:a,hi=a===b?b+1:b,rough=(hi-low)/4,order=Math.pow(10,Math.floor(Math.log10(rough||1))),step=([1,2,2.5,5,10].find(v=>v*order>=rough)||10)*order;const bottom=Math.floor(low/step)*step,top=Math.ceil(hi/step)*step,vals=[];for(let i=0;i<=10;i++){const v=bottom+i*step;if(v>top+step*.0001)break;vals.push(+v.toFixed(4));}return {bottom,top,vals};}
function chart(){const {shown,start}=chartPoints(),vals=[start,...shown.map(p=>p.cumulative)];const a=axisTicks(Math.min(0,...vals),Math.max(0,...vals)),W=700,H=210,L=12,R=10,T=17,B=17;const x=i=>L+(W-L-R)*(vals.length<2?0:i/(vals.length-1)),y=v=>T+(H-T-B)*(1-(v-a.bottom)/(a.top-a.bottom||1));const path=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2)).join(' ');const labels=a.vals.map(v=>`<span class="tick ${v===0?'zero':''}" style="top:${y(v)/H*100}%">${(v>0?'+':'')+new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(v)} €</span>`).join('');const i=chartSelected===null?shown.length:Math.max(0,Math.min(shown.length,chartSelected)),p=shown[i-1],value=i?p.cumulative:start;const dots=shown.map((q,j)=>`<circle cx="${x(j+1)}" cy="${y(q.cumulative)}" r="${i===j+1?5:3}" fill="#0d7454" stroke="white" stroke-width="2"/><circle tabindex="0" role="button" aria-label="Abend ${j+1} wählen" class="chart-hit" data-point="${j+1}" cx="${x(j+1)}" cy="${y(q.cumulative)}" r="${Math.max(8,Math.min(15,280/Math.max(1,shown.length)))}" fill="transparent"/>`).join('');
return `<div class="chart-toolbar">${[['all','Gesamt'],['last10','Letzte 10'],['month','Monat']].map(([id,label])=>`<button type="button" class="chip ${chartRange===id?'chosen':''}" data-chart-range="${id}">${label}</button>`).join('')}</div><div class="chart-wrap"><div class="chart-y-axis" aria-hidden="true">${labels}</div><svg class="chart chart-plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Abendbilanz mit Euro-Skala">${a.vals.map(v=>`<path d="M${L} ${y(v)}H${W-R}" class="gridline"/>`).join('')}<path class="chartline" d="${vals.length>1?path:`M${L} ${y(start)}H${W-R}`}"/>${dots}</svg></div><div class="chart-inspector"><b>${p?labelDate(p.date):'Zeitraumbeginn'}</b><span class="amount ${amountColor(value)}"> ${euro(value)} Gesamtstand</span>${p?`<p class="help">Abend: ${euro(p.amount)}</p>`:''}</div>${shown.length?`<input id="chartScrub" type="range" min="0" max="${shown.length}" value="${i}" aria-label="Spielabend im Diagramm auswählen">`:'<p class="help">Trage deinen ersten Schafkopfabend ein.</p>'}`;}
function simpleRow(e){const date=new Date(e.date+'T12:00:00');const name=e.auto?'Automatischer Spielabend':e.kind==='game'?gameLabel(e.gameType):e.place||'Schafkopfabend';return `<div class="card entry ${e.auto?'auto-entry':''}"><div class="datebadge">${date.getDate()}<small>${date.toLocaleDateString('de-DE',{month:'short'})}</small></div>${e.kind==='game'?`<div class="history-game-icon">${richGameIcon(e.gameType)}</div>`:''}<div class="entryinfo"><b title="${esc(name)}">${esc(name)}</b><span>${labelDate(e.date)}${e.auto?` · ${e.gameCount} ${e.gameCount===1?'Einzelspiel':'Einzelspiele'}`:''}${e.kind==='game'&&e.scoreData?` · ${e.gameType==='bettel'?e.scoreData.tricks+' Ansager-Stiche':e.gameType==='ramsch'?e.scoreData.points+' Punkte, '+e.scoreData.jungfrau+' Jungfrauen':e.scoreData.points+' Punkte'} · Spielpreis ${normalEUR(e.scoreData.price)}`:''}${e.place&&e.kind==='game'?' · '+esc(e.place):''}${e.notes?' · '+esc(e.notes):''}</span>${e.auto?'<span class="origin-label automatic">↻ Automatisch aus Spielen</span>':e.kind==='session'?'<span class="origin-label">Manuell erfasst</span>':''}</div><span class="amount ${amountColor(e.amount)}">${euro(e.amount)}</span><div class="entry-actions">${e.auto?'<button type="button" class="mini-btn auto-open" data-tab="games" title="Einzelspiele ansehen" aria-label="Einzelspiele ansehen">↗</button>':`<button class="mini-btn" data-edit="${esc(e.id)}" title="Bearbeiten" aria-label="Eintrag bearbeiten">✎</button><button class="mini-btn" data-delete="${esc(e.id)}" title="Löschen" aria-label="Eintrag löschen">×</button>`}</div></div>`;}

function history(){const editing=state.entries.find(e=>e.id===editId&&e.kind==='session');return `<div class="content-page"><div class="notice session-notice"><b>Deine Abende entstehen automatisch.</b> Alle Einzelspiele eines Datums werden zu einem Abend zusammengefasst. Wenn du ohne Einzelspiel-Tracker spielst, kannst du hier wie bisher deinen Abend manuell eintragen. Ein manueller Abend am selben Datum hat Vorrang, damit die Bilanz nicht doppelt zählt.</div><section class="section card formcard"><h2>${editing?'Abend bearbeiten':'Abend manuell eintragen'}</h2><form id="sessionForm" class="stack"><label class="field">Datum<input type="date" id="date" required value="${editing?editing.date:nowISO()}"></label><p id="manualDateInfo" class="manual-date-info hidden" role="status"></p><div class="field"><span>Ergebnis</span><div class="result-toggle"><button type="button" class="result-btn ${!editing||editing.amount>=0?'selected win':''}" data-session-sign="1">+ Gewinn</button><button type="button" class="result-btn ${editing?.amount<0?'selected loss':''}" data-session-sign="-1">− Verlust</button></div><input type="hidden" id="resultType" value="${editing?.amount<0?-1:1}"></div><label class="field">Betrag (€)<input type="text" id="amount" inputmode="decimal" placeholder="z. B. 3,50" required value="${editing?Math.abs(editing.amount).toFixed(2).replace('.',','):''}"></label><details class="advanced" ${editing?.place||editing?.notes?'open':''}><summary>Ort und Notiz (optional)</summary><div class="stack"><label class="field">Ort / Runde<input id="place" maxlength="80" value="${esc(editing?.place||'')}" placeholder="z. B. Hütte"></label><label class="field">Notiz<textarea id="notes" maxlength="160">${esc(editing?.notes||'')}</textarea></label></div></details><button type="submit" class="btn primary-full">${editing?'Änderung speichern':'Abend speichern'}</button>${editing?'<button class="btn ghost" type="button" id="cancelEdit">Abbrechen</button>':''}<p class="help" id="entryError" role="alert"></p></form></section><section class="section"><div class="sectionhead"><h2>Deine Spielabende</h2><span class="subtle">${sessionEntries().length} Abende · ${autoSessionEntries().length} automatisch</span></div>${list(sessionEntries())}</section></div>`;}
function updateManualDateInfo(){
 const d=document.getElementById('date'),hint=document.getElementById('manualDateInfo');if(!d||!hint)return;
 const n=gameEntries().filter(g=>g.date===d.value).length;
 hint.classList.toggle('hidden',!n);
 if(n)hint.textContent=`An diesem Datum gibt es bereits ${n} getrackte ${n===1?'Spiel':'Spiele'}. Der manuelle Betrag wird für diesen Abend anstelle der automatisch berechneten Summe angezeigt.`;
}
const FAST_TYPES=['rufspiel','solo','wenz','geier','farbwenz','farbgeier','bettel','ramsch'];
const AUTO_TYPES=['rufspiel','solo','wenz','geier','farbwenz','farbgeier','bettel','ramsch','hochzeit','kreuzrunde','bockrunde','hirsch','tout','sie'];
const SOLO_TYPES=['solo','wenz','geier','farbwenz','farbgeier','bettel','tout','sie'];
function typeButtons(ids){return ids.map(id=>`<button type="button" class="game-select game-art ${quickType===id?'chosen':''}" data-game-type="${id}" aria-pressed="${quickType===id}"><span class="gico">${richGameIcon(id)}</span><span>${gameLabel(id)}</span></button>`).join('');}
const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.floor(Number(v)||0)));
function maxRunners(type){
 if(type==='wenz'||type==='geier')return 4;
 if(type==='solo'||type==='farbwenz'||type==='farbgeier'||type==='tout'||type==='sie')return 8;
 if(type==='rufspiel'||type==='hochzeit'||type==='kreuzrunde'||type==='bockrunde'||type==='hirsch')return 14;
 return 0;
}
function minRunners(type){return type==='rufspiel'?Number(state.rules.rufMinRunners)===4?4:3:3;}
function getRates(){return {...defaultRates(),...(state.rates||{})};}
function baseFor(type){
 const r=getRates();
 if(['rufspiel','bockrunde','hirsch'].includes(type))return r.rufspiel/100;
 if(type==='ramsch')return r.ramsch/100;
 if(type==='hochzeit')return r.hochzeit/100;
 if(type==='kreuzrunde')return r.kreuzrunde/100;
 if(['solo','wenz','geier','farbwenz','farbgeier','tout'].includes(type))return r.solo/100;
 if(type==='bettel')return r.bettel/100;
 if(type==='sie')return r.solo/100; // Solotarif; (Solo + 8 Laeufer) wird erst danach vervierfacht
 return null;
}
function calcPricing(input){
 const type=input.type,base=baseFor(type);
 if(base===null)return {manual:true,price:0,amount:0,lines:[]};
 const knocks=clampInt(input.knocks,0,8);
 const bid=clampInt(input.bid,0,3);
 const runnersRaw=clampInt(input.runners,0,maxRunners(type));
 const runners=runnersRaw>=minRunners(type)?runnersRaw:0;
 const r=getRates();
 const schuss=state.rules.allowSchuss?clampInt(input.schuss,0,8):0;
 const jungfrau=type==='ramsch'?clampInt(input.jungfrau,0,3):0;
 const points=clampInt(input.points,0,120);
 const role=input.role==='defender'?'defender':type==='ramsch'&&input.role==='payer'?'payer':type==='ramsch'?'receiver':'declarer';
 const bock=type==='bockrunde'||!!input.bock;
 const cashSolo=SOLO_TYPES.includes(type);
 const pointGame=!['bettel','ramsch','tout','sie'].includes(type);
 let won=false,schneider=false,schwarz=false,loserPoints=null,usedRunners=0;
 if(pointGame){
  // Als Gegner reichen 60 Augen. Die Ansager-Partei muss mindestens 61 haben.
  won=role==='defender'?points>=60:points>=61;
  loserPoints=won?120-points:points;
  schneider=loserPoints<30;
  schwarz=loserPoints===0; // auch wenn ein punktloser Stich gemacht wurde
  usedRunners=runners;
 }else if(type==='bettel'){
  const tricks=clampInt(input.tricks,0,8);
  const declarerWon=tricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
 }else if(type==='ramsch'){
  won=role!=='payer';
 }else if(type==='tout'){
  // Tout gelingt nur bei 8 Ansagerstichen: kein Stich für die Gegenpartei.
  const opponentTricks=clampInt(input.tricks,0,8);
  const declarerWon=opponentTricks===0;
  won=role==='defender'?!declarerWon:declarerWon;
  usedRunners=runners;
 }else if(type==='sie'){
  won=true; // Das angesagte Sie gewinnt definitionsgemäß.
  usedRunners=8;
 }
 // Geldbeträge konsequent in Cent berechnen.
 const baseCents=Math.round(base*100);
 const schneiderCents=schneider?r.schneider:0;
 const schwarzCents=schwarz?r.schwarz:0;
 const runnerCents=usedRunners*r.laeufer;
 const subtotalCents=baseCents+schneiderCents+schwarzCents+runnerCents;
 const specialMultiplier=type==='sie'?4:type==='tout'?2:1;
 const knockMultiplier=2**knocks;
 const schussMultiplier=2**schuss;
 const jungfrauMultiplier=2**jungfrau;
 const bidMultiplier=2**(type==='hirsch'?3:bid);
 const bockMultiplier=bock?2:1;
 const multiplier=specialMultiplier*knockMultiplier*schussMultiplier*jungfrauMultiplier*bidMultiplier*bockMultiplier;
 const priceCents=subtotalCents*multiplier;
 const roleFactor=type==='ramsch'?(won?1:3):type==='sie'?3:cashSolo?(role==='defender'?1:3):1;
 const amountCents=(won?1:-1)*priceCents*roleFactor;
 return {manual:false,won,schneider,schwarz,loserPoints,runner:usedRunners,runners:usedRunners,jungfrau,knocks,schuss,role,roleFactor,base,extras:schneiderCents/100,blackExtra:schwarzCents/100,runnerExtra:runnerCents/100,subtotal:subtotalCents/100,price:priceCents/100,amount:amountCents/100,multiplier,specialMultiplier,knockMultiplier,schussMultiplier,jungfrauMultiplier,bidMultiplier,bid:type==='hirsch'?3:bid,bock,bockMultiplier,points};
}
const gameDraft=()=>({points:61,knocks:0,schuss:0,runners:0,tricks:0,jungfrau:0,bock:false,bid:0,toutSubtype:'solo',role:'declarer',legacyManual:false,manualAmount:'0,50',manualSign:1,date:nowISO(),place:'',notes:''});
let draft=gameDraft(),specialOpen=false;
function draftFromEntry(e){const saved=e.scoreData||{};return {...gameDraft(),...saved,legacyManual:!e.scoreData,manualAmount:Math.abs(e.amount).toFixed(2).replace('.',','),manualSign:e.amount<0?-1:1,date:e.date,place:e.place||'',notes:e.notes||''};}
function ruleStepper(id,label,value,min,max,detail=''){return `<div class="rule-row"><div><b>${label}</b>${detail?`<div class="help">${detail}</div>`:''}</div><div class="stepper"><button type="button" data-step="${id}" data-change="-1" aria-label="${label} verringern" ${value<=min?'disabled':''}>−</button><span>${value}</span><button type="button" data-step="${id}" data-change="1" aria-label="${label} erhöhen" ${value>=max?'disabled':''}>+</button></div></div>`;}
function chooseRole(label1,label2,value1,value2){return `<div class="result-toggle small-toggle"><button type="button" data-role="${value1}" class="result-btn ${draft.role===value1?'selected win':''}">${label1}</button><button type="button" data-role="${value2}" class="result-btn ${draft.role===value2?'selected win':''}">${label2}</button></div>`;}
function priceDetails(result){
 if(result.manual)return `<div class="price-panel"><b>Eigener Spielpreis</b><div class="help">Für diese Sonderregel wurde noch kein Preis festgelegt.</div></div>`;
 const notes=[];
 notes.push(`<div><span>Grundpreis</span><b>${normalEUR(result.base)}</b></div>`);
 if(result.schneider)notes.push(`<div><span>Schneider (Verliererpartei unter 30)</span><b>+${normalEUR(result.extras)}</b></div>`);
 if(result.schwarz)notes.push(`<div><span>Schwarz (Verliererpartei 0 Punkte)</span><b>+${normalEUR(result.blackExtra)}</b></div>`);
 if(result.runner)notes.push(`<div><span>${result.runner} Läufer</span><b>+${normalEUR(result.runnerExtra)}</b></div>`);
 if(result.specialMultiplier>1)notes.push(`<div><span>${quickType==='tout'?'Tout':'Sie'}</span><b>× ${result.specialMultiplier}</b></div>`);
 if(result.knocks)notes.push(`<div><span>${result.knocks} Klopfer / Legen</span><b>× ${result.knockMultiplier}</b></div>`);
 if(result.schuss)notes.push(`<div><span>${result.schuss} Schuss</span><b>× ${result.schussMultiplier}</b></div>`);
 if(result.jungfrau)notes.push(`<div><span>${result.jungfrau} Jungfrau(en)</span><b>× ${result.jungfrauMultiplier}</b></div>`);
 if(result.bid)notes.push(`<div><span>${result.bid===1?'Kontra':result.bid===2?'Kontra + Re':'Kontra + Re + Hirsch'}</span><b>× ${result.bidMultiplier}</b></div>`);
 if(result.bock)notes.push(`<div><span>Bockrunde</span><b>× 2</b></div>`);
 if(result.roleFactor>1)notes.push(`<div><span>${draft.role==='payer'?'Zahler gegen 3':'Ansager gegen 3'}</span><b>× ${result.roleFactor}</b></div>`);
 return `<div class="price-panel"><div class="price-panel-heading"><b>${quickType==='sie'?'Preis pro Gegner':'Spielpreis'}</b><strong>${normalEUR(result.price)}</strong></div>${notes.join('')}<div class="price-final"><span>Deine Bilanz</span><strong class="${amountColor(result.amount)}">${euro(result.amount)}</strong></div><p class="help">${result.won?'Gewonnen':'Verloren'} · Zuschläge werden vor der Verdopplung addiert.</p></div>`;
}
function gameCalculation(){if(draft.legacyManual)return {manual:true,price:0,amount:0};return calcPricing({type:quickType,...draft});}
function gamePriceContent(){
 const g=gameCalculation(),isManual=g.manual;
 const pointType=!isManual&&!['ramsch','bettel','tout','sie'].includes(quickType);
 const roleNormal=pointType||['bettel','tout','sie'].includes(quickType);
 const resultLabel=(g.won?'Gewonnen':'Verloren')+(g.schneider?' · Schneider':'')+(g.schwarz?' · Schwarz':'');
 return `<div class="game-entry-area"><div class="step-label">2 · Spiel auswerten</div>
 ${pointType?`<label class="field compact-field">Erreichte Punkte (deine Partei, 0–120)<input type="number" inputmode="numeric" id="gamePoints" min="0" max="120" step="1" value="${draft.points}" required></label><div class="score-meter"><div style="width:${draft.points/120*100}%"></div></div><div class="outcome ${g.won?'success':'fail'}">${draft.points} / 120 Punkte · ${resultLabel}</div><p class="help">Schneider: 0–29 Punkte der Verliererpartei; Schwarz: 0 Punkte – beide Zuschläge zusammen.</p>${maxRunners(quickType)?ruleStepper('runners','Läufer',Math.min(draft.runners,maxRunners(quickType)),0,maxRunners(quickType),`0 oder ${minRunners(quickType)}–${maxRunners(quickType)} Läufer. Bei dieser Spielart maximal ${maxRunners(quickType)}.`):''}`:''}
 ${quickType==='bettel'?`<label class="field compact-field">Stiche des Ansagers (0–8)<input type="number" id="gameTricks" min="0" max="8" step="1" inputmode="numeric" value="${draft.tricks}"></label><div class="outcome ${g.won?'success':'fail'}">${draft.tricks===0?'Ansager ohne Stich – erfolgreich':'Ansager hat Stich(e) – verloren'} · ${g.won?'Gewonnen':'Verloren'}</div>`:''}
 ${quickType==='tout'?`<label class="field compact-field">Stiche der Gegenspieler (0–8)<input type="number" id="gameTricks" min="0" max="8" step="1" inputmode="numeric" value="${draft.tricks}"></label><div class="outcome ${g.won?'success':'fail'}">Tout ${draft.tricks===0?'erfüllt':'gescheitert'} · ${g.won?'Gewonnen':'Verloren'}</div>${ruleStepper('runners','Läufer',Math.min(draft.runners,maxRunners(quickType)),0,maxRunners(quickType),'Keine Schneider-/Schwarz-Zuschläge bei Tout.')}`:''}
 ${quickType==='sie'?`<div class="outcome success">Sie: automatisch gewonnen · 8 Läufer eingerechnet</div><p class="help">(Solo-Grundpreis + 8 × Läuferzuschlag) × 4, anschließend ggf. ×2 je Klopfer/Leger. Jeder der 3 Gegner zahlt den Spielpreis.</p>`:''}
 ${quickType==='ramsch'?`<p class="help">Beim Ramsch zahlt der Spieler mit den meisten Punkten. Jede Jungfrau verdoppelt den Preis.</p><label class="field">Deine Punkte (0–120, nur zur Dokumentation)<input type="number" inputmode="numeric" id="gameRamschPoints" min="0" max="120" step="1" value="${draft.points}"></label>${ruleStepper('jungfrau','Jungfrauen',draft.jungfrau,0,3,'1 = ×2, 2 = ×4, 3 = ×8.')}`:''}
 ${roleNormal&&quickType!=='sie'?`<div class="field"><span>Deine Rolle</span>${chooseRole('Ansagerpartei','Gegnerpartei','declarer','defender')}</div>`:''}
 ${quickType==='ramsch'?`<div class="field"><span>Dein Ergebnis</span>${chooseRole('Ich erhalte Geld','Ich zahle','receiver','payer')}</div>`:''}
 ${isManual?`${draft.legacyManual?'<p class="help">Alter Eintrag: Der manuelle Betrag bleibt erhalten. Spielart erneut wählen, um automatische Berechnung zu nutzen.</p>':''}<div class="field"><span>Dein Ergebnis</span><div class="result-toggle"><button type="button" data-manual-sign="1" class="result-btn ${draft.manualSign>0?'selected win':''}">+ Gewinn</button><button type="button" data-manual-sign="-1" class="result-btn ${draft.manualSign<0?'selected loss':''}">− Verlust</button></div></div><label class="field">Betrag (€)<input type="text" inputmode="decimal" id="gameManualAmount" value="${esc(draft.manualAmount)}" placeholder="z. B. 0,50"></label>`:ruleStepper('knocks','Klopfer / Legen',draft.knocks,0,8,'Jeder Klopfer verdoppelt den Betrag.')}
 ${!isManual&&quickType!=='ramsch'?`<details class="advanced optional-rules" id="specialRules" ${specialOpen?'open':''}><summary>Weitere Regeln: Bockrunde${state.rules.allowKontra||quickType==='hirsch'?', Kontra / Re / Hirsch':''}</summary><div class="stack"><label class="check-row"><input type="checkbox" id="gameBock" ${draft.bock||quickType==='bockrunde'?'checked':''} ${quickType==='bockrunde'?'disabled':''}><span><b>Bockrunde ×2</b><small>Verdoppelt zusätzlich den Spielpreis.</small></span></label>${state.rules.allowKontra||quickType==='hirsch'?`<label class="field">Steigerung<select id="gameBid" ${quickType==='hirsch'?'disabled':''}><option value="0" ${draft.bid===0?'selected':''}>Keine</option><option value="1" ${draft.bid===1?'selected':''}>Kontra ×2</option><option value="2" ${draft.bid===2?'selected':''}>Re ×4</option><option value="3" ${draft.bid===3?'selected':''}>Hirsch ×8</option></select></label>`:''}</div></details>`:''}
 ${!isManual&&state.rules.allowSchuss?ruleStepper('schuss','Schuss',draft.schuss,0,8,'Nach dem Legen: Jeder Schuss verdoppelt nochmals.'):''}
 ${!isManual?priceDetails(g):''}</div>`;
}
function singleGameUI(){const editing=state.entries.find(e=>e.id===editId&&e.kind==='game');const g=summary(gameEntries()),showExtras=moreTypes||!FAST_TYPES.includes(quickType);
 return `<div class="content-page"><section class="card formcard game-fast-panel"><div class="sectionhead"><h2>${editing?'Spiel bearbeiten':'Neues Spiel'}</h2><span class="badge">${g.count} Spiele</span></div><form id="gameForm" class="stack"><div class="step-label">1 · Spielart auswählen</div><div class="fast-game-grid">${typeButtons(FAST_TYPES)}</div><button type="button" class="more-toggle" id="toggleExtra">${showExtras?'Weniger Spielarten ▲':'Weitere Spielarten ▼'}</button>${showExtras?`<div class="fast-game-grid extras">${typeButtons(GAME_TYPES.map(g=>g.id).filter(id=>!FAST_TYPES.includes(id)))}</div>`:''}<div id="gamePriceArea">${gamePriceContent()}</div><button type="submit" class="btn primary-full">${editing?'Änderung speichern':'✓ Spiel speichern + nächstes'}</button><details class="advanced"><summary>Weitere Angaben (optional)</summary><div class="stack"><label class="field">Datum<input type="date" id="gameDate" value="${draft.date}"></label><label class="field">Ort / Runde<input id="gamePlace" maxlength="80" value="${esc(draft.place)}"></label><label class="field">Notiz<textarea id="gameNotes" maxlength="160">${esc(draft.notes)}</textarea></label></div></details>${editing?'<button type="button" class="btn ghost" id="cancelEdit">Abbrechen</button>':''}<p id="gameError" class="help" role="alert"></p></form></section><section class="section"><div class="sectionhead"><h2>Deine Einzelspiele</h2><span class="subtle">${g.count} Spiele</span></div>${list(gameEntries(),showAllGames?Infinity:8)}${g.count>8?`<button class="btn ghost see-all" id="toggleAllGames">${showAllGames?'Nur letzte 8 anzeigen':'Alle '+g.count+' Spiele anzeigen'}</button>`:''}</section></div>`;
}
function readDraftFromDom(){
 const points=document.getElementById('gamePoints')||document.getElementById('gameRamschPoints'),tricks=document.getElementById('gameTricks'),manual=document.getElementById('gameManualAmount');
 if(points&&points.value!=='')draft.points=clampInt(points.value,0,120);
 if(tricks&&tricks.value!=='')draft.tricks=clampInt(tricks.value,0,8);
 if(manual)draft.manualAmount=manual.value;
 const bock=document.getElementById('gameBock'),bid=document.getElementById('gameBid');
 if(bock)draft.bock=bock.checked;if(bid)draft.bid=clampInt(bid.value,0,3);
 const date=document.getElementById('gameDate'),place=document.getElementById('gamePlace'),notes=document.getElementById('gameNotes');

let calculationRenderBusy=false;
function refreshCalculation(){
 const current=document.getElementById('gamePriceArea');if(!current||calculationRenderBusy)return;
 calculationRenderBusy=true;
 try{
  specialOpen=!!document.getElementById('specialRules')?.open;
  const el=document.activeElement,focusId=el&&el.id,selection=el&&el.type==='text'?el.selectionStart:null;
  const markup=gamePriceContent();
  current.innerHTML=markup;
  if(focusId){const next=document.getElementById(focusId);if(next){next.focus({preventScroll:true});if(selection!==null&&next.setSelectionRange)next.setSelectionRange(selection,selection);}}

function trumpSort(a,b){
 const colors=['eichel','gras','herz','schell'];

  const type=counter.type;
  const core=type==='wenz'||type==='farbwenz'?['U']:type==='geier'||type==='farbgeier'?['O']:type==='bettel'?[]:['O','U'];
  if(core.includes(c.rank))return core.indexOf(c.rank)*4+colors.indexOf(c.suit);
  const other=['A','10','K','O','U','9','8','7'].filter(rank=>!core.includes(rank));
  return core.length*4+other.indexOf(c.rank)*4+colors.indexOf(c.suit);
 };

 if(ta!==tb)return ta?-1:1;
 if(ta)return order(a)-order(b);

}

const STITCH_SUIT_ORDER=['eichel','gras','herz','schell'];

 if(type==='geier')return c.rank==='O';
 if(type==='farbwenz')return c.rank==='U'||c.suit===suit;
 if(type==='farbgeier')return c.rank==='O'||c.suit===suit;

function stitchTrumpStrength(c,type,suit){
 if(!stitchIsTrumpFor(c,type,suit))return Infinity;
 const core=(type==='wenz'||type==='farbwenz')?['U']:(type==='geier'||type==='farbgeier')?['O']:['O','U'];
 if(core.includes(c.rank))return core.indexOf(c.rank)*4+STITCH_SUIT_ORDER.indexOf(c.suit);
 const other=STITCH_CARD_ORDER.filter(r=>!core.includes(r));
 return core.length*4+other.indexOf(c.rank);
}
/* Kleinerer Wert gewinnt: Trumpf schlaegt Farbe; sonst fuehrt die erste Karte. */
function stitchWinnerIndex(cards,type,suit){
 if(!Array.isArray(cards)||cards.length!==4||cards.some(id=>!CARD_MAP[id]))return -1;
 const four=cards.map(id=>CARD_MAP[id]),lead=four[0];
 function power(c){
  if(stitchIsTrumpFor(c,type,suit))return [0,stitchTrumpStrength(c,type,suit)];
  if(!stitchIsTrumpFor(lead,type,suit)&&c.suit===lead.suit)return [1,STITCH_CARD_ORDER.indexOf(c.rank)];

 }
 let winner=0,score=power(lead);
 four.forEach((c,i)=>{const rank=power(c);if(rank[0]<score[0]||(rank[0]===score[0]&&rank[1]<score[1])){winner=i;score=rank;}});

}
/* Das gerufene Ass enthuellt den Rufspielpartner erst, wenn es tatsaechlich liegt.

function stitchPartnerSeat(game=stitch){
 if(!partneredStitch(game.type))return null;
 if(game.type!=='rufspiel'||game.partnerMode!=='auto')return validStitchSeat(game.partnerSeat)?game.partnerSeat:null;
 const ace=(['eichel','gras','schell'].includes(game.calledSuit)?game.calledSuit:'eichel')+'-A';
 for(const trick of game.tricks){
  const i=trick.cards.indexOf(ace);
  if(i>=0&&validStitchSeat(trick.leaderSeat))return stitchPositionFromLeader(trick.leaderSeat,i);

}
function stitchMyDeclarerTeam(game=stitch){

function stitchTeamForSeat(seat,game=stitch){

 if(mySide===null)return null;

function stitchReconcileTeams(game=stitch){
 // Für Teamwerte ist die Sitzposition die Quelle der Wahrheit, nicht das alte Siegerflag.
 if(game.type==='rufspiel'&&game.partnerMode==='auto'&&!stitchPartnerSeat(game))return;
 game.role=stitchMyDeclarerTeam(game)?'declarer':'defender';
 for(const t of game.tricks)if(validStitchSeat(t.winnerSeat))t.winner=stitchTeamForSeat(t.winnerSeat,game)||'pending';
}
function stitchNextLeader(game=stitch){return game.tricks.at(-1)?.winnerSeat||game.firstSeat;}
function stitchIsLegacy(game=stitch){return game.tricks.some(t=>!t.winnerSeat);}
function stitchPrediction(game=stitch){
 if(game.current.length!==4||stitchIsLegacy(game))return null;
 const index=stitchWinnerIndex(game.current,game.type,game.trumpSuit);
 if(index<0)return null;
 const seat=stitchPositionFromLeader(stitchNextLeader(game),index);
 return {index,seat,winner:stitchTeamForSeat(seat,game)};
}

 }

function stitchTotals(tricks=stitch.tricks,game=stitch){

  return stitchTeamTotalsBySeats({...game,tricks});

}
function stitchSeatTotals(tricks=[]){

 for(const t of tricks){if(validStitchSeat(t.winnerSeat)){scores[t.winnerSeat].eyes+=t.eyes;scores[t.winnerSeat].tricks++;}}

}

function stitchTrainingSummary(archive=stitch.archive){

function stitchChange(target){if(trainingView!=='stitch'||gamesSubtab!=='counter'||tab!=='games')return false;
 if(target.id==='stitchWinnerOverride'){
  stitch.overrideSeat=validStitchSeat(target.value)?target.value:'';
  saveStitch();refreshStitch();return true;
 }
 const recognized=['stitchType','stitchSuit','stitchCalledSuit','stitchDeclarerSeat','stitchMySeat','stitchPartnerSeat','stitchPartnerMode','stitchFirstSeat'];
 if(!recognized.includes(target.id))return false;
 const structural=['stitchType','stitchSuit','stitchFirstSeat'];
 if(structural.includes(target.id)&&(stitch.tricks.length||stitch.current.length)){
  if(!confirm('Spielart, Trumpf oder Ausspiel ändern? Die laufende Partie muss neu begonnen werden. Abgeschlossene Trainingsspiele bleiben erhalten.')){refreshStitch();return true;}
  stitch.tricks=[];stitch.current=[];stitch.overrideSeat='';stitch.started=new Date().toISOString();
 }
 if(target.id==='stitchType'&&STITCH_TYPES.some(t=>t[0]===target.value)){
  const previous=stitch.type;stitch.type=target.value;
  if(target.value==='rufspiel'&&previous!=='rufspiel'){stitch.partnerMode='auto';stitch.partnerSeat=null;}
  if(target.value!=='rufspiel'&&partneredStitch(target.value)&&!validStitchSeat(stitch.partnerSeat))stitch.partnerSeat=stitchPartnerOf(stitch.declarerSeat);
 }
 if(target.id==='stitchSuit'&&CARD_SUITS.some(t=>t.id===target.value))stitch.trumpSuit=target.value;
 if(target.id==='stitchCalledSuit'&&['eichel','gras','schell'].includes(target.value))stitch.calledSuit=target.value;
 if(target.id==='stitchMySeat'&&validStitchSeat(target.value))stitch.mySeat=target.value;
 if(target.id==='stitchFirstSeat'&&validStitchSeat(target.value))stitch.firstSeat=target.value;
 if(target.id==='stitchDeclarerSeat'&&validStitchSeat(target.value)){
  stitch.declarerSeat=target.value;
  if(stitch.partnerSeat===stitch.declarerSeat)stitch.partnerSeat=stitchPartnerOf(stitch.declarerSeat);
 }
 if(target.id==='stitchPartnerMode'&&['auto','manual'].includes(target.value)){
  stitch.partnerMode=target.value;
  stitch.partnerSeat=stitch.partnerMode==='manual'?stitchPartnerOf(stitch.declarerSeat):null;
 }
 if(target.id==='stitchPartnerSeat'&&validStitchSeat(target.value)&&target.value!==stitch.declarerSeat)stitch.partnerSeat=target.value;
 stitchReconcileTeams();saveStitch();refreshStitch();return true;
}

/* Wastl 2.7 – nur eigene Regeln und lokal gespeicherte Trainingsdaten; keine KI-API. */
let mentorMode=false,mentorGameId='',mentorStep=0,mentorTab='overview';
function mentorPromo(){return `<div class="mentor-teaser"><img src="wastl.png" alt="Wastl, dein bayerischer Schafkopf-Mentor"><div class="mentor-teaser-info"><b>Servus, i bin da Wastl!</b><p>I schau mit dir deine aufgezeichneten Stiche an – mit Lob, Hinweisen und erklärbaren Regeln.</p></div><button type="button" class="btn" id="mentorStart">Partie analysieren →</button></div>`;}
function mentorGameList(){return [...stitch.archive].filter(g=>g&&Array.isArray(g.tricks)).sort((a,b)=>String(b.started).localeCompare(String(a.started)));}
function mentorSelected(){return stitch.archive.find(g=>String(g.id)===String(mentorGameId))||null;}
function mentorComplete(g){return !!g&&g.tricks.length===8&&g.tricks.every(t=>Array.isArray(t.cards)&&t.cards.length===4&&t.cards.every(id=>CARD_MAP[id]));}
function mentorRuleCheck(g){
 if(!mentorComplete(g))return {ready:false,reason:'Diese Partie enthält noch keine acht vollständig dokumentierten Stiche.'};
 const all=g.tricks.flatMap(t=>t.cards),distinct=new Set(all);
 if(distinct.size!==32)return {ready:false,reason:'In der Aufzeichnung sind Karten mehrfach enthalten. Deshalb kann ich die Handkarten nicht zuverlässig rekonstruieren.'};
 const seqOk=g.tricks.every(t=>validStitchSeat(t.leaderSeat)&&validStitchSeat(t.winnerSeat));
 if(!seqOk)return {ready:false,reason:'Bei dieser älteren Partie fehlen teilweise Sitzpositionen. Die Stichpunkte kann ich ansehen, aber keine individuellen Züge sicher bewerten.'};
 const eyes=g.tricks.reduce((sum,t)=>sum+t.cards.reduce((acc,id)=>acc+CARD_MAP[id].eyes,0),0);
 if(eyes!==120)return {ready:false,reason:'Die erfassten Karten ergeben nicht genau 120 Augen.'};
 return {ready:true,reason:''};
}
function mentorHands(g){
 if(!mentorRuleCheck(g).ready)return null;
 const hands=Object.fromEntries(STITCH_SEAT_IDS.map(id=>[id,[]]));
 for(const t of g.tricks){for(let i=0;i<4;i++)hands[stitchPositionFromLeader(t.leaderSeat,i)].push(t.cards[i]);}
 if(STITCH_SEAT_IDS.some(s=>hands[s].length!==8))return null;
 return hands;
}
function mentorSuitClass(card,g){return stitchIsTrumpFor(card,g.type,g.trumpSuit)?'trump':card.suit;}
function mentorLegalOptions(remaining,leadCard,g){
 if(!leadCard)return remaining;
 const color=mentorSuitClass(leadCard,g),following=remaining.filter(id=>mentorSuitClass(CARD_MAP[id],g)===color);
 return following.length?following:remaining;
}
function mentorSeatNameShort(id,game){return (game?.seatNames&&game.seatNames[id])?game.seatNames[id]:stitchSeatLabel(id);}
function mentorSeatRole(id,game){if(id===game.mySeat)return 'Du';if(game.declarerSeat===id)return 'Ansager';if(game.partnerSeat===id)return 'Partner';return stitchSeatLabel(id);}
function mentorHandState(g,idx){
 const hands=mentorHands(g);if(!hands)return null;
 const used=Object.fromEntries(STITCH_SEAT_IDS.map(id=>[id,new Set()]));
 for(let ti=0;ti<idx;ti++){
  const trick=g.tricks[ti];
  for(let i=0;i<4;i++)used[stitchPositionFromLeader(trick.leaderSeat,i)].add(trick.cards[i]);
 }
 const before=Object.fromEntries(STITCH_SEAT_IDS.map(id=>[id,hands[id].filter(c=>!used[id].has(c))]));
 const t=g.tricks[idx];
 const after=Object.fromEntries(STITCH_SEAT_IDS.map(id=>[id,[...before[id]]]));
 if(t)for(let i=0;i<4;i++){
  const seat=stitchPositionFromLeader(t.leaderSeat,i);
  after[seat]=after[seat].filter(c=>c!==t.cards[i]);
 }
 return {before,after};
}
function mentorEvaluateAlternative(game,trick,myPlay){
 if(!myPlay||!myPlay.alternatives?.length||!validStitchSeat(trick.winnerSeat))return null;
 if(['ramsch','bettel'].includes(game.type))return null;
 const chosen=CARD_MAP[myPlay.id];
 const originalWinnerIndex=stitchWinnerIndex(trick.cards,game.type,game.trumpSuit);
 const originalWinnerSeat=stitchPositionFromLeader(trick.leaderSeat,originalWinnerIndex);
 const originalTeam=stitchTeamForSeat(originalWinnerSeat,game);
 const eye=trick.cards.reduce((s,id)=>s+CARD_MAP[id].eyes,0);
 let best=null;
 for(const altId of myPlay.alternatives){
  const alt=CARD_MAP[altId],cards=[...trick.cards];cards[myPlay.position]=altId;
  const altWinnerIndex=stitchWinnerIndex(cards,game.type,game.trumpSuit);if(altWinnerIndex<0)continue;
  const altWinnerSeat=stitchPositionFromLeader(trick.leaderSeat,altWinnerIndex);
  const altTeam=stitchTeamForSeat(altWinnerSeat,game);
  const chosenTrump=stitchIsTrumpFor(chosen,game.type,game.trumpSuit),altTrump=stitchIsTrumpFor(alt,game.type,game.trumpSuit);
  let score=0,reason='';
  if(originalTeam!=='us'&&altTeam==='us'){score=100;reason=`Mit ${alt.name} hätte dein Team diesen Stich voraussichtlich gewonnen. Das wäre bei ${eye} Augen eine starke Verbesserung gewesen.`;}
  else if(originalTeam==='us'&&altTeam==='us'){
   if(chosenTrump&&!altTrump){score=60;reason=`Mit ${alt.name} wäre der Stich ebenfalls bei euch geblieben. Du hättest also einen Trumpf geschont.`;}
   else if(chosenTrump&&altTrump&&stitchTrumpStrength(alt,game.type,game.trumpSuit)>stitchTrumpStrength(chosen,game.type,game.trumpSuit)){score=55;reason=`${alt.name} hätte ebenfalls gereicht. So hättest du den stärkeren Trumpf ${chosen.name} für später behalten können.`;}
   else if(alt.eyes<chosen.eyes){score=35;reason=`${alt.name} hätte ebenfalls funktioniert und weniger Augen bzw. weniger Wert preisgegeben.`;}
  } else if(originalTeam==='them'&&altTeam==='them'){
   if(alt.eyes<chosen.eyes){score=45;reason=`Mit ${alt.name} hättest du bei einem verlorenen Stich weniger Augen an die Gegner abgegeben.`;}
   else if(chosenTrump&&!altTrump){score=25;reason=`Der Stich wäre wohl trotzdem verloren gegangen. ${alt.name} hätte aber einen Trumpf auf der Hand gelassen.`;}
  }
  if(myPlay.position===0 && score<35 && alt.eyes<chosen.eyes){score=35;reason=`Beim Ausspiel wäre ${alt.name} die etwas ruhigere Eröffnung gewesen.`;}
  if(score>0 && (!best||score>best.score))best={cardId:altId,score,reason};
 }
 return best;
}
function mentorStichEvidence(g){
 const hands=mentorHands(g),seen=Object.fromEntries(STITCH_SEAT_IDS.map(id=>[id,new Set()])),tricks=[];
 for(let idx=0;idx<g.tricks.length;idx++){
  const t=g.tricks[idx],eye=t.cards.reduce((x,id)=>x+CARD_MAP[id].eyes,0),notes=[],lead=CARD_MAP[t.cards[0]];
  let myPlay=null;
  if(hands){
   for(let i=0;i<4;i++){
    const seat=stitchPositionFromLeader(t.leaderSeat,i),id=t.cards[i],owned=hands[seat].filter(c=>!seen[seat].has(c)),opts=mentorLegalOptions(owned,i===0?null:lead,g),alternatives=opts.filter(c=>c!==id);
    if(!opts.includes(id))notes.push({type:'warn',heading:'Bedienpflicht prüfen',detail:`Im Stich ${idx+1} scheint ${stitchSeatLabel(seat)} eine Farbe oder Trumpf nicht bedient zu haben, obwohl nach dem rekonstruierten Blatt passende Karten vorhanden waren. Bitte prüfe zuerst, ob die Karten richtig eingetragen wurden.`});
    if(seat===g.mySeat)myPlay={id,opts,alternatives,seat,position:i};
    seen[seat].add(id);
   }
  } else if(validStitchSeat(t.leaderSeat)){
   const i=STITCH_SEAT_IDS.findIndex(id=>id===g.mySeat);
   const pos=(i-STITCH_SEAT_IDS.indexOf(t.leaderSeat)+4)%4;
   myPlay={id:t.cards[pos],opts:null,alternatives:[],seat:g.mySeat,position:pos};
  }
  const winTeam=validStitchSeat(t.winnerSeat)?stitchTeamForSeat(t.winnerSeat,g):null;
  let alternative=null;
  if(myPlay){
   const chosen=CARD_MAP[myPlay.id],hadTrump=stitchIsTrumpFor(chosen,g.type,g.trumpSuit),won=winTeam==='us';
   if(won&&eye>=20)notes.push({type:'good',heading:g.type==='ramsch'?'Augenreicher eigener Stich':'Augenstarker Stich für dein Team',detail:g.type==='ramsch'?`Du hast in Stich ${idx+1} ${eye} Augen erhalten. Beim Ramsch sind viele eigene Augen normalerweise eher ungünstig.`:`Dein Team hat in Stich ${idx+1} ${eye} Augen gewonnen. Entscheidend ist dabei die gesamte Stichfolge, nicht nur deine eigene Karte.`});
   if(g.type!=='ramsch'&&winTeam==='them'&&chosen.eyes>=10)notes.push({type:'tip',heading:'Viele Augen abgegeben',detail:`Du hast ${chosen.name} mit ${chosen.eyes} Augen gelegt; dieser Stich ging an die Gegner. Ob eine andere Karte besser gewesen wäre, hängt von deinen damaligen Informationen ab.`});
   if(hadTrump&&idx<3&&['O','U'].includes(chosen.rank))notes.push({type:'tip',heading:'Früher hoher Trumpf',detail:`Du hast bereits in Stich ${idx+1} ${chosen.name} eingesetzt. Überlege, ob dir damit wichtige Trumpfkontrolle erhalten blieb – das ist kein sicherer Fehler.`});
   alternative=mentorEvaluateAlternative(g,t,myPlay);
   if(alternative){notes.push({type:'tip',heading:'Mögliche bessere Karte',detail:alternative.reason});}
   else if(myPlay.alternatives.length){const alt=CARD_MAP[myPlay.alternatives[0]].name;notes.push({type:'neutral',heading:'Andere legale Karte möglich',detail:`Nach dem vollständig rekonstruierten Blatt hättest du hier auch ${alt} spielen dürfen. Das heißt nicht automatisch, dass diese Karte besser gewesen wäre.`});}
  }
  if(g.type==='rufspiel'&&g.calledSuit&&t.cards.includes(g.calledSuit+'-A'))notes.push({type:'good',heading:'Ruf-Ass deckt die Partnerschaft auf',detail:`In Stich ${idx+1} fällt das gerufene Ass. Jetzt lässt sich die Parteizugehörigkeit auch für die vorherigen Stiche rückwirkend zuordnen.`});
  const detected=validStitchSeat(t.leaderSeat)?stitchWinnerIndex(t.cards,g.type,g.trumpSuit):-1;
  if(detected>=0&&validStitchSeat(t.winnerSeat)&&stitchPositionFromLeader(t.leaderSeat,detected)!==t.winnerSeat)notes.push({type:'warn',heading:'Stichgewinner prüfen',detail:`Nach den hinterlegten Trumpfregeln ergäbe sich in Stich ${idx+1} ein anderer Sieger als gespeichert. Prüfe die Aufzeichnung oder die verwendete Hausregel.`});
  if(!notes.length)notes.push({type:'neutral',heading:'Stich dokumentiert',detail:`${eye} Augen wurden im Stich ${idx+1} erfasst. Ohne klare zusätzliche Anhaltspunkte wäre eine Bewertung als gut oder schlecht Spekulation.`});
  tricks.push({index:idx,eye,notes,myPlay,winTeam,raw:t,alternative});
 }
 return {hands,tricks};
}
function mentorGeneral(g){
 const valid=mentorRuleCheck(g), all=Array.isArray(g.tricks)?g.tricks:[],eyes=all.reduce((n,t)=>n+(Array.isArray(t.cards)?t.cards.reduce((sum,id)=>sum+(CARD_MAP[id]?.eyes||0),0):0),0),trumps=all.flatMap(t=>t.cards||[]).filter(id=>CARD_MAP[id]&&stitchIsTrumpFor(CARD_MAP[id],g.type,g.trumpSuit)).length;
 const good=[],tip=[];
 if(all.length===8&&eyes===120)good.push('Alle 32 Karten und 120 Augen wurden vollständig erfasst.');
 else tip.push('Der Verlauf ist noch nicht vollständig genug für eine zuverlässige Gesamtbewertung.');
 if(valid.ready){
  const mine=mentorStichEvidence(g).tricks,personal=mine.filter(t=>t.myPlay),best=personal.filter(t=>t.winTeam==='us').sort((a,b)=>b.eye-a.eye)[0],loss=personal.filter(t=>t.winTeam==='them'&&CARD_MAP[t.myPlay.id].eyes>=10).sort((a,b)=>b.eye-a.eye)[0];
  if(best&&best.eye>=20&&g.type!=='ramsch')good.push(`Ein starker Stich für dein Team: Stich ${best.index+1} mit ${best.eye} Augen.`);
  if(loss&&g.type!=='ramsch')tip.push(`Schau dir Stich ${loss.index+1} noch einmal an: Du hast eine augenreiche Karte an die Gegner abgegeben. Das muss kein Fehler gewesen sein.`);
  const suspicious=mine.flatMap(t=>t.notes).filter(n=>n.heading==='Bedienpflicht prüfen'||n.heading==='Stichgewinner prüfen');
  if(suspicious.length)tip.push(`${suspicious.length} Auffälligkeit(en) bei Bedienpflicht oder Stichgewinner: Kontrolliere zunächst die Erfassung.`);
  if(!suspicious.length)good.push('Keine offensichtlichen Abweichungen von der geprüften Bedienpflicht im rekonstruierten Verlauf gefunden.');
  if(trumps>0)tip.push(`${trumps} Trumpfkarten wurden gespielt. Überlege, wie sich deine Trumpfkontrolle von Stich zu Stich entwickelt hat.`);
 }
 return {valid,eyes,trumps,good,tip};
}
function mentorSpeech(message){return `<div class="mentor-hero"><img class="mentor-portrait" src="wastl.png" alt="Wastl, dein fiktiver Schafkopf-Mentor"><div class="mentor-bubble">${esc(message)}</div></div>`;}
function mentorHint(t){return `<div class="mentor-note ${t.type==='warn'?'warn':''}"><span class="dot">${t.type==='warn'?'!':t.type==='good'?'✓':t.type==='tip'?'💡':'•'}</span><div><strong>${esc(t.heading)}</strong><p>${esc(t.detail)}</p></div></div>`;}
function mentorLearnCard(item){
 const icon=item.type==='good'?'✓':item.type==='warn'?'!':'!';
 return `<div class="mentor-learn-item ${item.type==='warn'?'warn':item.type==='good'?'good':'tip'}"><div class="mentor-learn-icon">${icon}</div><div><h4>${esc(item.heading)}</h4><p>${esc(item.detail)}</p></div><div>›</div></div>`;
}
function mentorHandCards(ids,suggestedId=''){
 return `<div class="mentor-hand-row">${ids.map(id=>`<span class="mentor-hand-card ${id===suggestedId?'suggested':''}"><span class="mentor-card-frame">${cardSVG(CARD_MAP[id])}</span></span>`).join('')}</div>`;
}
function mentorTableScene(game,trickInfo,step,state){
 const trick=trickInfo.raw; const altId=trickInfo.alternative?.cardId||''; const after=state?.after||null;
 const positions=['top','right','bottom','left'];
 const seatOrder=[stitchPositionFromLeader(trick.leaderSeat,0),stitchPositionFromLeader(trick.leaderSeat,1),stitchPositionFromLeader(trick.leaderSeat,2),stitchPositionFromLeader(trick.leaderSeat,3)];
 const cardsHtml=seatOrder.map((seat,i)=>`<div class="mentor-table-card mentor-card-${positions[i]} ${seat===game.mySeat?'own-card':''}">${cardSVG(CARD_MAP[trick.cards[i]])}</div>`).join('');
 const top=stitchPositionFromLeader(game.mySeat,2), left=stitchPositionFromLeader(game.mySeat,3), right=stitchPositionFromLeader(game.mySeat,1), bottom=game.mySeat;
 const seatChip=(seat,pos)=>`<div class="mentor-seat-chip mentor-seat-${pos}"><b>${esc(mentorSeatNameShort(seat,game))}</b><small>${esc(mentorSeatRole(seat,game))}</small></div>`;
 const notesLead = validStitchSeat(trick.leaderSeat)?`Ausspiel: ${mentorSeatNameShort(trick.leaderSeat,game)} (${CARD_MAP[trick.cards[0]].name})`:'Ausspiel unbekannt';
 const notesWin = validStitchSeat(trick.winnerSeat)?`Stichgewinner: ${mentorSeatNameShort(trick.winnerSeat,game)}`:'Stichgewinner: offen';
 const afterMine=after?.[game.mySeat]||[];
 return `<div class="mentor-table-shell"><div class="mentor-table-head"><div><h3>Stich ${step+1} von ${game.tricks.length}</h3><div class="mentor-head-sub">${esc(stitchTypeName(game.type))} · ${trickInfo.eye} Augen</div></div><div class="pager"><button class="mentor-nav" type="button" data-mentor-step="${step-1}" ${step===0?'disabled':''}>‹</button><button class="mentor-nav" type="button" data-mentor-step="${step+1}" ${step>=game.tricks.length-1?'disabled':''}>›</button></div></div><div class="mentor-wood"><div class="mentor-scene">${seatChip(top,'top')}${seatChip(left,'left')}${seatChip(right,'right')}${seatChip(bottom,'bottom')}${cardsHtml}<div class="mentor-played-banner"><b>${esc(notesWin)}</b><small>${esc(notesLead)}</small></div></div></div><div class="mentor-hand-wrap"><div class="mentor-hand-title"><b>Deine übrigen Karten nach diesem Stich</b><span>${afterMine.length} Karten übrig</span></div>${afterMine.length?mentorHandCards(afterMine,altId):'<p class="help" style="color:#d8eadf">Nach dem letzten Stich sind keine Karten mehr auf deiner Hand.</p>'}</div></div>`;
}

// Stable Schafkopf card order: trump by rank, then nontrump by suit and rank.
function wastlCardOrder(cards,game){
 const ranks=['A','10','K','O','U','9','8','7'];
 const suits=['eichel','gras','herz','schell'];
 return [...cards].sort((id1,id2)=>{
   const a=CARD_MAP[id1],b=CARD_MAP[id2];
   const ta=stitchIsTrumpFor(a,game.type,game.trumpSuit),tb=stitchIsTrumpFor(b,game.type,game.trumpSuit);
   if(ta!==tb)return ta?-1:1;
   if(ta)return stitchTrumpStrength(a,game.type,game.trumpSuit)-stitchTrumpStrength(b,game.type,game.trumpSuit);
   return suits.indexOf(a.suit)-suits.indexOf(b.suit)||ranks.indexOf(a.rank)-ranks.indexOf(b.rank);
 });
}
function wastlCompactSpeech(game,t,step,valid){
 if(!valid.ready)return 'Des schau ma uns an. Manche Karten sind noch nicht ganz eindeutig erfasst.';
 if(t.notes?.some(n=>n.type==='warn'))return 'Bei diesem Stich passt möglicherweise die Kartenfolge nicht. Schau ma genauer hin!';
 if(t.alternative)return `Da hätt i eine andere Karte in Betracht gezogen. Magst wissen, warum?`;
 if(t.winTeam==='us')return 'Gut! Die Augen gehen an dein Team. So kann ma weiterspielen!';
 return 'Interessanter Stich! Für eine sichere Bewertung müsst ma die ganze Spielsituation betrachten.';
}
function wastlFullScreen(game,info,t,step,handState){
 const cards=t.raw.cards, seats={};
 // Reconstruct which individual card belongs to which PLAYER, not the position at which it was dealt.
 cards.forEach((id,i)=>{seats[stitchPositionFromLeader(t.raw.leaderSeat,i)]=id;});
 const ids=STITCH_SEAT_IDS, me=ids.indexOf(game.mySeat);
 const position={top:ids[(me+2)%4],left:ids[(me+3)%4],right:ids[(me+1)%4],bottom:ids[me]};
 const slot=(side)=>{
   const seat=position[side],card=CARD_MAP[seats[seat]];
   return `<div class="ws-spot ${side}${seat===game.mySeat?' mine':''}"><span>${esc(seat===game.mySeat?'Du':mentorSeatNameShort(seat,game))}</span>${card?cardSVG(card):''}</div>`;
 };
 const remaining=handState?.after?.[game.mySeat]||[];
 const sorted=wastlCardOrder(remaining,game);
 const fan=sorted.length?sorted.map((id,i)=>{
   const center=(sorted.length-1)/2,off=i-center;
   return `<span class="ws-fan-card${id===t.alternative?.cardId?' highlight':''}" style="--tilt:${off*4.2}deg;--lift:${Math.abs(off)*2}px;--z:${i+1}">${cardSVG(CARD_MAP[id])}</span>`;
 }).join(''):`<div class="ws-empty-hand">Alle Karten gespielt – die Partie ist beendet.</div>`;
 const winner=t.raw.winnerSeat?mentorSeatNameShort(t.raw.winnerSeat,game):'Noch offen';
 const detailText=t.notes?.length?t.notes.map(mentorHint).join(''):'<p>Zu diesem Stich liegen keine weiteren Hinweise vor.</p>';
 const alt=t.alternative?`<div class="ws-detail-alt">${cardSVG(CARD_MAP[t.alternative.cardId])}<p><strong>Alternative Überlegung:</strong> ${esc(t.alternative.reason)}</p></div>`:'';
 const reason=info.valid.ready?'<p>Wastl ist ein lokaler Ratgeber. Ein Vorschlag ist keine sichere optimale Spielstrategie.</p>':`<p>${esc(info.valid.reason||'Die Erfassung ist nicht vollständig.')}</p>`;
 return `<div class="ws-fullscreen" role="dialog" aria-modal="true" aria-label="Wastl Stichanalyse im Vollbild">
   <header class="ws-topbar">
     <button type="button" id="wsClose" aria-label="Analyse schließen">←</button>
     <div class="ws-step-label"><strong>Stich ${step+1} von ${game.tricks.length}</strong><small>${esc(stitchTypeName(game.type))} · ${t.eye} Augen</small></div>
     <div class="ws-nav"><button type="button" data-mentor-step="${step-1}" ${step===0?'disabled':''} aria-label="Vorheriger Stich">‹</button><button type="button" data-mentor-step="${step+1}" ${step>=game.tricks.length-1?'disabled':''} aria-label="Nächster Stich">›</button></div>
   </header>
   <main class="ws-board">
     <div class="ws-guide"><img class="ws-portrait" src="wastl.png" alt="Wastl"><div class="ws-speech"><span class="ws-speech-copy">${esc(wastlCompactSpeech(game,t,step,info.valid))}</span><button class="ws-speech-more" type="button" data-ws-more aria-label="Wastls ausführliche Erklärung">ⓘ</button></div></div>
     <section class="ws-felt" aria-label="Kartentisch mit den vier gespielten Karten">
       <div class="ws-winner"><b>Stichgewinner</b><span>${esc(winner)}</span></div>
       ${slot('top')}${slot('left')}${slot('right')}${slot('bottom')}
     </section>
     <section class="ws-hand" aria-label="Deine verbleibenden Handkarten"><div class="ws-hand-caption">Deine Hand · ${sorted.length} Karte${sorted.length===1?'':'n'} übrig</div><div class="ws-fan">${fan}</div></section>
   </main>
   <div class="ws-detail-scrim" data-ws-scrim hidden>
     <div class="ws-detail-sheet" role="region" aria-label="Wastls weitere Hinweise"><button class="ws-detail-close" type="button" data-ws-dismiss aria-label="Zusatzinfos schließen">×</button><h3>Wastl erklärt diesen Stich</h3>${detailText}${alt}${reason}</div>
   </div>
 </div>`;
}
function mentorUI(){
 const g=mentorSelected();
 if(!g)return `<div class="content-page mentor-view"><div class="wastl-single-intro"><img src="wastl.png" alt="Wastl, dein Schafkopf-Mentor"><div><div class="ey">Dein Schafkopf-Mentor</div><h2>Servus! I bin da Wastl.</h2><p>Such dir eine gespeicherte Partie aus, dann schauen wir uns Stich für Stich gemeinsam an, was die Karten hergeben.</p></div></div><div class="mentor-title"><h2>Gespeicherte Trainingspartien</h2><span class="badge">${stitch.archive.length} Partien</span></div><div class="mentor-list section">${mentorGameList().map(x=>`<button class="mentor-game-row" type="button" data-mentor-open="${esc(x.id)}"><span class="gico">${richGameIcon(x.type)}</span><span class="maintext"><b>${esc(stitchTypeName(x.type))}</b><small>${new Date(x.started).toLocaleDateString('de-DE')} · ${x.tricks.length} Stiche · ${x.tricks.reduce((n,t)=>n+(t.eyes||0),0)} Augen</small></span><span>→</span></button>`).join('')||'<div class="card empty">Noch kein archivierter Stichverlauf. Unter Erfassen → Karten tracken → Mit Stichverlauf kannst du die erste Partie erfassen.</div>'}</div><p class="mentor-rule">Wastl ist ein kostenloser, lokaler Lernbegleiter. Seine Hinweise beruhen auf den gespeicherten Stichen und einfachen Regeln, nicht auf einer Online-KI.</p></div>`;
 const info=mentorGeneral(g),analysis=mentorStichEvidence(g);
 const step=Math.max(0,Math.min(g.tricks.length-1,mentorStep));
 const t=analysis.tricks[step];
 if(!t)return `<div class="content-page mentor-view"><button class="btn ghost" id="mentorBack">← Zur Partieauswahl</button><p>Für diese Partie fehlen Stichdaten.</p></div>`;
 return wastlFullScreen(g,info,t,step,mentorHandState(g,step));
}

document.addEventListener('click',e=>
{

 if(e.target.closest('#mentorStart')){mentorMode=true;mentorGameId='';switchTab('mentor');return;}

render();


document.addEventListener('click',e=>{
 const more=e.target.closest('[data-ws-more]');
 if(more){const root=e.target.closest('.ws-fullscreen');const scrim=root?.querySelector('[data-ws-scrim]');if(scrim){scrim.hidden=false;scrim.querySelector('[data-ws-dismiss]')?.focus();}return;}
 const close=e.target.closest('[data-ws-dismiss]');
 if(close||e.target.matches('[data-ws-scrim]')){const root=e.target.closest('.ws-fullscreen');const scrim=root?.querySelector('[data-ws-scrim]');if(scrim){scrim.hidden=true;root.querySelector('[data-ws-more]')?.focus();}return;}
 if(e.target.closest('#wsClose')){mentorGameId='';mentorStep=0;render();return;}
},true);
document.addEventListener('keydown',e=>{
 const root=document.querySelector('.ws-fullscreen');if(!root)return;
 if(e.key==='Escape'){const scrim=root.querySelector('[data-ws-scrim]');if(scrim&&!scrim.hidden){scrim.hidden=true;root.querySelector('[data-ws-more]')?.focus();}else{mentorGameId='';mentorStep=0;render();}}
 if(e.key==='ArrowRight'&&root.querySelector('[data-ws-scrim]')?.hidden){const btn=root.querySelector('[data-mentor-step]:last-child');if(btn&&!btn.disabled)btn.click();}
 if(e.key==='ArrowLeft'&&root.querySelector('[data-ws-scrim]')?.hidden){const btn=root.querySelector('[data-mentor-step]:first-child');if(btn&&!btn.disabled)btn.click();}
});
